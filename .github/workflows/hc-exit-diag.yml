name: hc-exit-diag (temporary, #240)

# Temporary: runs the published app's self-test many times under a debugger and without one, to
# catch the exit with code 1 around the high-contrast switch (#240). Removed before merge.
on:
  push:
    branches: [fix/app-hc-exit]

permissions:
  contents: read

jobs:
  diag:
    name: diag (${{ matrix.runtime }} ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
        shard: [1, 2, 3]
        include:
          - runtime: win-x64
            runner: windows-latest
            arch: x64
          - runtime: win-arm64
            runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish the app
        shell: pwsh
        run: |
          dotnet publish src/AgentBridge.App/AgentBridge.App.csproj -c Release -r ${{ matrix.runtime }} -o "$env:RUNNER_TEMP/app" --nologo -v q -p:Version=0.1.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Find a debugger
        shell: pwsh
        run: |
          $cdb = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\${{ matrix.arch }}\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $cdb) {
            Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers" -ErrorAction SilentlyContinue | ForEach-Object { "debuggers: $($_.Name)" }
            winget install --id Microsoft.WinDbg --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>&1 | Select-Object -Last 3
            $cdb = Get-ChildItem "$env:ProgramFiles\WindowsApps\Microsoft.WinDbg*\${{ matrix.arch == 'x64' && 'amd64' || 'arm64' }}\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          "cdb: $($cdb.FullName)"
          "CDB=$($cdb.FullName)" >> $env:GITHUB_ENV
      - name: WER local dumps
        shell: pwsh
        run: |
          $dumps = "$env:RUNNER_TEMP\dumps"
          New-Item -ItemType Directory -Force $dumps | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\AgentBridge.exe'
          New-Item -Force $key | Out-Null
          New-ItemProperty -Force $key -Name DumpFolder -PropertyType ExpandString -Value "$dumps\wer" | Out-Null
          New-ItemProperty -Force $key -Name DumpType -PropertyType DWord -Value 2 | Out-Null
          New-ItemProperty -Force $key -Name DumpCount -PropertyType DWord -Value 5 | Out-Null
      - name: Self-test, again and again
        shell: pwsh
        env:
          _NT_SYMBOL_PATH: srv*${{ runner.temp }}\symbols*https://msdl.microsoft.com/download/symbols
        run: |
          Add-Type -Namespace Diag -Name Hc -MemberDefinition @'
          [StructLayout(LayoutKind.Sequential)] public struct HIGHCONTRAST { public uint cbSize; public uint dwFlags; public IntPtr scheme; }
          [DllImport("user32.dll", SetLastError = true)] public static extern bool SystemParametersInfoW(uint a, uint p, ref HIGHCONTRAST v, uint w);
          public static void Off() { var h = new HIGHCONTRAST(); h.cbSize = (uint)Marshal.SizeOf(h); SystemParametersInfoW(0x42, h.cbSize, ref h, 0); if ((h.dwFlags & 1) != 0) { h.dwFlags &= ~1u; SystemParametersInfoW(0x43, h.cbSize, ref h, 2); } }
          '@
          $exe = "$env:RUNNER_TEMP\app\AgentBridge.exe"
          $out = "$env:RUNNER_TEMP\diag"
          $dumps = "$env:RUNNER_TEMP\dumps"
          New-Item -ItemType Directory -Force $out | Out-Null
          $arm = '${{ matrix.arch }}' -eq 'arm64'
          $code = if ($arm) { 'x0' } else { 'rcx' }
          $status = if ($arm) { 'x1' } else { 'rdx' }
          $d = $dumps -replace '\\', '\\\\'
          $stacks = 'kn 80; ~*kn 50'
          @"
          .echo DIAG: attached
          sxe -c ".echo DIAG: fail fast; .lastevent; .ecxr; $stacks; g" -c2 ".echo DIAG: fail fast, second chance; .lastevent; .exr -1; kn 80; lmvm Microsoft_UI_Windowing_Core; lmvm Microsoft_UI_Xaml; ~*kn 50; !analyze -v; .dump /ma /u $d\\failfast.dmp; q" c0000409
          sxe -c ".echo DIAG: access violation; .lastevent; .exr -1; r; kn 80; ~*kn 50; g" av
          sxe -c ".echo DIAG: stowed exception; .lastevent; .ecxr; $stacks; .dump /ma /u $d\\stowed.dmp; g" c000027b
          sxd -c2 ".echo DIAG: second-chance exception; .lastevent; .ecxr; $stacks; .dump /ma /u $d\\second.dmp; q" av
          sxd -c2 ".echo DIAG: second-chance exception; .lastevent; .ecxr; $stacks; .dump /ma /u $d\\second.dmp; q" *
          sxd -c2 ".echo DIAG: second-chance exception; .lastevent; !pe; $stacks; .dump /ma /u $d\\second.dmp; q" clr
          sxd -c2 ".echo DIAG: second-chance exception; .lastevent; .ecxr; $stacks; .dump /ma /u $d\\second.dmp; q" eh
          sxe -c ".echo DIAG: exit event; .lastevent; g" epr
          bu ntdll!RtlExitUserProcess ".if (@$code != 0) { .echo DIAG: RtlExitUserProcess with a nonzero code; r $code; $stacks; .dump /ma /u $d\\exit.dmp } ; g"
          bu ntdll!NtTerminateProcess ".if (@$status != 0) { .echo DIAG: NtTerminateProcess with a nonzero status; r $code; r $status; $stacks; .dump /ma /u $d\\terminate.dmp } ; g"
          bu KERNELBASE!TerminateProcess ".if (@$status != 0) { .echo DIAG: TerminateProcess with a nonzero code; r $code; r $status; $stacks; .dump /ma /u $d\\terminateprocess.dmp } ; g"
          g
          "@ | Set-Content "$out\cdb.txt"
          $runs = 20; $bad = 0
          for ($i = 1; $i -le $runs; $i++) {
            $debugged = $env:CDB -and (($i % 3 -ne 0) -or -not $arm) -and (($i % 2 -eq 1) -or $arm)
            Remove-Item "$env:LOCALAPPDATA\AgentBridge\app\*.log" -ErrorAction SilentlyContinue
            $result = "$out\run$i\result.json"
            New-Item -ItemType Directory -Force "$out\run$i" | Out-Null
            $start = Get-Date
            if ($debugged) {
              $p = Start-Process $env:CDB -ArgumentList '-G', '-lines', '-cf', "`"$out\cdb.txt`"", "`"$exe`"", '--self-test', "`"$result`"" -RedirectStandardOutput "$out\run$i\cdb.log" -PassThru -NoNewWindow
              $null = $p.Handle
              $finished = $p.WaitForExit(240000)
              if (-not $finished) { Stop-Process -Id $p.Id -Force; Get-Process AgentBridge -ErrorAction SilentlyContinue | Stop-Process -Force }
              $m = Select-String "$out\run$i\cdb.log" -Pattern 'Exit process .*, code ([0-9a-fA-F]+)' | Select-Object -Last 1
              $exit = if ($m) { $m.Matches[0].Groups[1].Value } else { 'none' }
              $failed = (-not $finished) -or ($exit -ne '0') -or (Select-String "$out\run$i\cdb.log" -Pattern 'DIAG: (?!attached|exit event)' -Quiet)
            } else {
              $p = Start-Process $exe -ArgumentList '--self-test', "`"$result`"" -PassThru
              $null = $p.Handle
              $finished = $p.WaitForExit(180000)
              if (-not $finished) { Stop-Process -Id $p.Id -Force }
              $exit = if ($finished) { $p.ExitCode } else { 'timeout' }
              $failed = "$exit" -ne '0'
            }
            Copy-Item "$env:LOCALAPPDATA\AgentBridge\app\*.log" "$out\run$i" -ErrorAction SilentlyContinue
            $unfinished = if (Test-Path $result) { (Get-Content $result -Raw | ConvertFrom-Json).unfinished } else { 'no result' }
            "run ${i}: $(if ($debugged) { 'cdb' } else { 'plain' }), exit $exit, unfinished '$unfinished', $([int]((Get-Date) - $start).TotalSeconds) s"
            if ($failed) {
              $bad++
              "::warning::run $i failed: exit $exit"
              "--- app.log"; Get-Content "$out\run$i\app.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
              if ($debugged) { "--- cdb"; Get-Content "$out\run$i\cdb.log" | Select-String -Pattern '^(ModLoad|Executable search path|Symbol search path)' -NotMatch | Select-Object -Last 900 }
              "--- events"
              Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $start.AddSeconds(-5) } -ErrorAction SilentlyContinue |
                Where-Object { $_.ProviderName -in 'Application Error', 'Windows Error Reporting', '.NET Runtime', 'Application Hang' } |
                ForEach-Object { "[$($_.TimeCreated.ToString('o'))] $($_.ProviderName) $($_.Id): $($_.Message)" }
              Get-ChildItem $dumps -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { "dump: $($_.FullName) $($_.Length)" }
            } else {
              Remove-Item "$out\run$i\*.png" -ErrorAction SilentlyContinue
            }
            [Diag.Hc]::Off()
            Start-Sleep 2
          }
          "$bad of $runs runs failed"
          if ($bad) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hc-exit-diag-${{ matrix.runtime }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/diag
            ${{ runner.temp }}/dumps
          retention-days: 5
