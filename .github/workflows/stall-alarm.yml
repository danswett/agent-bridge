name: Stall alarm

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stall-alarm
  cancel-in-progress: false

jobs:
  alarm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Evaluate and publish the operational alert
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MAIN_GREEN_NODE: ${{ vars.STALL_ALARM_MAIN_GREEN_NODE }}
          CHIEF_NODE: ${{ vars.STALL_ALARM_CHIEF_NODE }}
          AGENT_HA_URL: ${{ secrets.AGENT_HA_URL }}
          AGENT_HA_AGENT_TOKEN: ${{ secrets.AGENT_HA_AGENT_TOKEN }}
        run: ./quality/stall-alarm.ps1 -Repository $env:REPOSITORY -MainGreenNode $env:MAIN_GREEN_NODE -ChiefNode $env:CHIEF_NODE
