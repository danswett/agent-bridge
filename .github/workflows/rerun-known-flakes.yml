name: Re-run main failures once

# Re-runs any first-attempt main CI failure once; attempt two classifies the outcome.
# S1 records the run and full SHA before dispatch; its issue holds the reservation.
# Cancelled jobs, newer pushes and an already-running rerun are left alone.
# A passing second attempt is a flake; a repeated failure stays red for mitigation.
# Attempt two is never re-run, including on repeated completion events.
#
# This runs main's copy of quality/rerun-known-flakes.ps1 (workflow_run always uses the default
# branch's workflow and checkout) and never checks out or runs the code of the run it reads.
# Its token can re-run workflows and comment on issues, nothing else.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  rerun:
    if: >-
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.run_attempt == 2)) &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.run_attempt <= 2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      issues: write
    concurrency:
      # Only duplicate deliveries may share a pending slot, never S1 or another completion.
      group: main-red-rerun-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record incident before handling the completion
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: pwsh -NoProfile -File quality/main-red.ps1 -RunId $env:RUN_ID -Repository $env:REPOSITORY
      - name: Re-run once or classify attempt two
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: pwsh -NoProfile -File quality/rerun-known-flakes.ps1 -RunId $env:RUN_ID -Repository $env:REPOSITORY -AutoRerun
