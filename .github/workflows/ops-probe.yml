name: Ops probe

# Once a day, the read-only outside-in check of production (ops/tools/relay-probe.ps1): health,
# readiness, the push key, CORS for the PWA, the TLS certificate's remaining life, and the DNS
# records its renewal depends on (docs/relay-deploy.md "Custom domain": a proxied or moved record
# makes renewal fail silently until the certificate expires). Problems go on one issue labelled
# area:ops, which closes itself on the first clean run (ops/alerts.md A-CERT, A-DNS).
#
# Minute-by-minute availability is Azure's job (infra/modules/monitoring.bicep), not this one's:
# certificate and DNS drift only need to be caught weeks ahead, and once a day keeps this off the
# shared runner pool (AGENTS.md "Before each push").
#
# The probe sends only anonymous requests to public endpoints and masks addresses in its output.

on:
  schedule:
    # 15:17 UTC: early morning Pacific, off the hour.
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, so two can never both find no issue open and both open one.
concurrency:
  group: ops-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Probe production
        id: probe
        shell: pwsh
        run: |
          pwsh -NoProfile -File ops/tools/relay-probe.ps1 -Target production -Json > "$env:RUNNER_TEMP/probe.json"
          "code=$LASTEXITCODE" >> $env:GITHUB_OUTPUT
          $r = Get-Content "$env:RUNNER_TEMP/probe.json" -Raw | ConvertFrom-Json
          @("Production probe at $($r.at)", '', '| Check | Status | Detail |', '|---|---|---|') + @($r.results | ForEach-Object { "| $($_.Check) | $($_.Status) | $($_.Detail) |" }) >> $env:GITHUB_STEP_SUMMARY
          exit 0
      - name: Open, update or close the ops issue
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./ops/tools/Publish-ProbeResult.ps1 -ResultFile "$env:RUNNER_TEMP/probe.json" -Repository $env:REPOSITORY -RunUrl $env:RUN_URL
      - name: Fail when production failed a check
        if: steps.probe.outputs.code == '1'
        shell: pwsh
        run: |
          Write-Host '::error::The production probe failed a check; see the run summary and the area:ops issue.'
          exit 1
