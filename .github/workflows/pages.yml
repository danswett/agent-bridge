name: Pages

# Publishes the spikes' browser self-tests, so they can be run on real devices (an
# iPhone's Safari in particular) without any server: https://danswett.github.io/agent-bridge/
on:
  push:
    branches: [main]
    paths: ['spikes/**/web/**', 'pwa/**', '.github/workflows/pages.yml']
  workflow_dispatch:

env:
  # The PWAs' relay. The pages are served from here, not by the relay, so a relay operator
  # cannot change the code that holds the keys.
  S4_RELAY: https://relay.bad-duck.com

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble site
        run: |
          mkdir -p _site/s2 _site/s4
          cp spikes/s2-noise-interop/web/* _site/s2/
          cp spikes/s4-relay/web/* _site/s4/
          cp spikes/s2-noise-interop/web/noise-p256.js _site/s4/
          printf "export const RELAY = '%s';\n" "$S4_RELAY" > _site/s4/config.js
          # Pages cannot send headers, so the policy goes in the page: script only from
          # this site, and network only to the one relay.
          relay_ws="wss://${S4_RELAY#https://}"
          csp="default-src 'self'; script-src 'self'; connect-src 'self' $S4_RELAY $relay_ws; img-src 'self' data:; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'"
          sed -i "s|<meta charset=\"utf-8\">|<meta charset=\"utf-8\">\n  <meta http-equiv=\"Content-Security-Policy\" content=\"$csp\">|" _site/s4/index.html
          grep -q 'Content-Security-Policy' _site/s4/index.html
          # The product PWA, at /app/. Its build writes config.js and the same policy,
          # with no inline styles allowed; the tests run against this exact output.
          node pwa/tools/build-site.mjs --out _site/app --relay "$S4_RELAY"
          grep -q 'Content-Security-Policy' _site/app/index.html
          grep -q "$S4_RELAY" _site/app/config.js
          cat > _site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>agent-bridge</title>
          <h1>agent-bridge</h1>
          <ul>
          <li><a href="app/">The app: your machines' agent sessions</a> (<a href="app/?demo=1">demo</a>)</li>
          <li><a href="s2/">S2: end-to-end encryption interop (Noise_XX_P256_AESGCM_SHA256)</a></li>
          <li><a href="s4/">S4: the spike PWA, through the relay to your hosts (test data only)</a></li>
          </ul>
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
