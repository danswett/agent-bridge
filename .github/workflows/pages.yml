name: Pages

# Publishes the spikes' browser self-tests, so they can be run on real devices (an
# iPhone's Safari in particular) without any server: https://danswett.github.io/agent-bridge/
# From the move to https://app.slipgates.com/ (#393) the PWA is the site's root and the spikes stay
# under /s2/ and /s4/.
# Deploys only the commit a green main CI run tested (#1313, #582): workflow_run of ci.yml,
# whatever the push touched, so a rebase race that breaks main ships nothing. Rollback is a manual
# run with ref=<last good sha> (ops/runbooks/pwa.md).
on:
  # Accepted: the build runs only a commit proven to be an ancestor of origin/main after a green
  # CI run on main, never checks out an event-supplied ref, and holds no publish token.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to build and deploy (a rollback); empty builds the ref the run was started on
        required: false
        type: string

env:
  # The PWAs' relay. The pages are served from here, not by the relay, so a relay operator
  # cannot change the code that holds the keys.
  S4_RELAY: https://relay.slipgates.com
  # Production's blob store (infra/regions/westus2.bicepparam, production.blobStorageName): the
  # app uploads large attachments straight to it, so its CSP names it.
  BLOB_ORIGIN: https://abblobprodwus2.blob.core.windows.net
  # Repository variable PAGES_APP_AT_ROOT=true puts the PWA at the site's root, for app.slipgates.com
  # (docs/app-domain.md). Unset, the site is as it was: the PWA at /app/.
  APP_AT_ROOT: ${{ vars.PAGES_APP_AT_ROOT }}
  # Public feedback recipient configuration. Until both repository variables are set, feedback
  # preview remains available but uploads stay disabled.
  FEEDBACK_KEY_ID: ${{ vars.FEEDBACK_KEY_ID }}
  FEEDBACK_PUBLIC_KEY: ${{ vars.FEEDBACK_PUBLIC_KEY }}

# Each job gets its own: the build runs the PWA's packages, so it holds no token that could publish
# (#650); the deploy publishes what the build made, and runs nothing from the repository.
permissions: {}

concurrency:
  group: pages
  # Every CI completion starts a run here, including red ones that deploy nothing: cancelling
  # would let a red run kill a deploy in progress.
  cancel-in-progress: false

jobs:
  # CI runs can finish out of push order, and main moves faster than CI finishes. So the newest
  # green commit deploys, and a run is skipped only when its commit is already live or older than
  # the live one (quality/pages-gate.ps1). The live commit is the APP_VERSION its config.js serves.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      # The default branch's copy of the gate script, never the commit being judged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: decide
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          APP_AT_ROOT: ${{ vars.PAGES_APP_AT_ROOT }}
        run: |
          $live = ''; $status = ''
          if ($env:HEAD_SHA) {
            try {
              $site = (gh api "repos/$env:GITHUB_REPOSITORY/pages" --jq .html_url).Trim().TrimEnd('/')
              $prefix = if ($env:APP_AT_ROOT -eq 'true') { '' } else { '/app' }
              $config = Invoke-RestMethod -Uri "$site$prefix/config.js?gate=$env:GITHUB_RUN_ID" -Headers @{ 'Cache-Control' = 'no-cache' }
              if ($config -match 'APP_VERSION = "([0-9a-f]{40})"') { $live = $Matches[1] }
              if ($live) { $status = (gh api "repos/$env:GITHUB_REPOSITORY/compare/$live...$env:HEAD_SHA" --jq .status 2>$null) }
            } catch { Write-Host "Live version unreadable: $($_.Exception.Message)" }
            $verdict = & quality/pages-gate.ps1 -Head $env:HEAD_SHA -Live $live -Status "$status"
            Write-Host $verdict[1]
            "deploy=$($verdict[0] -eq 'deploy')".ToLower() >> $env:GITHUB_OUTPUT
          } else {
            'deploy=true' >> $env:GITHUB_OUTPUT
          }

  build:
    needs: gate
    # A CI run that did not succeed, or was not a push to main, deploys nothing.
    if: needs.gate.outputs.deploy == 'true' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app-path: ${{ steps.hashes.outputs.app-path }}
      config-sha256: ${{ steps.hashes.outputs.config-sha256 }}
      sw-sha256: ${{ steps.hashes.outputs.sw-sha256 }}
    steps:
      # Check out the default branch, then move to the commit CI tested (a rollback names its own)
      # only once it is proven to be on main, so no step runs code from an unverified ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Move to the verified commit
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || inputs.ref || github.sha }}
        run: |
          git rev-parse --verify --quiet "$TARGET_SHA^{commit}" > /dev/null
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || { echo "::error::$TARGET_SHA is not on main"; exit 1; }
          git checkout --detach "$TARGET_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # The PWA's build bundles its scripts with esbuild (pwa/tools/build-site.mjs), as locked.
      # No install scripts: esbuild runs from its platform package without its own, and nothing
      # else here needs one (ci.yml's light job builds the same way).
      - name: The PWA's packages
        run: npm ci --prefix pwa --ignore-scripts --no-audit --no-fund
      - name: Assemble site
        run: |
          # The product PWA. Its build writes config.js and the same policy, with no inline styles
          # allowed; the tests run against this exact output. It goes first: the build clears its
          # output directory. APP_AT_ROOT is set only for the move to app.slipgates.com (#393), when
          # the PWA takes the site's root; until then it stays at /app/, where installed apps are.
          if [ "$APP_AT_ROOT" = 'true' ]; then app=_site; else app=_site/app; fi
          node pwa/tools/build-site.mjs --out "$app" --relay "$S4_RELAY" --blob-origin "$BLOB_ORIGIN" --version "$(git rev-parse HEAD)" --built-at "$(git show -s --format=%cI HEAD)" --feedback-key-id "$FEEDBACK_KEY_ID" --feedback-public-key "$FEEDBACK_PUBLIC_KEY"
          grep -q 'Content-Security-Policy' "$app/index.html"
          grep -q "$BLOB_ORIGIN" "$app/index.html"
          grep -q "$S4_RELAY" "$app/config.js"
          grep -qF "$S4_RELAY" "$app"/bundle/main-*.js
          mkdir -p _site/s2 _site/s4 _site/app
          cp spikes/s2-noise-interop/web/* _site/s2/
          cp spikes/s4-relay/web/* _site/s4/
          cp spikes/s2-noise-interop/web/noise-p256.js _site/s4/
          printf "export const RELAY = '%s';\n" "$S4_RELAY" > _site/s4/config.js
          # Pages cannot send headers, so the policy goes in the page: script only from
          # this site, and network only to the one relay.
          relay_ws="wss://${S4_RELAY#https://}"
          csp="default-src 'self'; script-src 'self'; connect-src 'self' $S4_RELAY $relay_ws; img-src 'self' data:; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'"
          sed -i "s|<meta charset=\"utf-8\">|<meta charset=\"utf-8\">\n  <meta http-equiv=\"Content-Security-Policy\" content=\"$csp\">|" _site/s4/index.html
          grep -q 'Content-Security-Policy' _site/s4/index.html
          if [ "$APP_AT_ROOT" = 'true' ]; then
            # The old address, danswett.github.io/agent-bridge/app/, is redirected here by Pages
            # and arrives at /app/: send it on to the app, keeping a deep link's query and fragment.
            cat > _site/app/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Slipgates has moved</title>
          <p>Slipgates is now at <a href="/">app.slipgates.com</a>.</p>
          <script src="redirect.js"></script>
          EOF
            printf "location.replace('/' + location.search + location.hash);\n" > _site/app/redirect.js
          else
            cat > _site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>agent-bridge</title>
          <h1>agent-bridge</h1>
          <ul>
          <li><a href="app/">The app: your machines' agent sessions</a> (<a href="app/?demo=1">demo</a>)</li>
          <li><a href="s2/">S2: end-to-end encryption interop (Noise_XX_P256_AESGCM_SHA256)</a></li>
          <li><a href="s4/">S4: the spike PWA, through the relay to your hosts (test data only)</a></li>
          </ul>
          EOF
          fi
      # What the deploy job compares the live site against.
      - id: hashes
        run: |
          if [ "$APP_AT_ROOT" = 'true' ]; then app=_site; prefix=''; else app=_site/app; prefix='app/'; fi
          {
            echo "app-path=$prefix"
            echo "config-sha256=$(sha256sum "$app/config.js" | cut -d' ' -f1)"
            echo "sw-sha256=$(sha256sum "$app/sw.js" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # The live config.js and sw.js must be the built ones. Pages' CDN can lag the deploy, so
      # retry for about five minutes; a mismatch after that fails the job (alert A-PAGES).
      - name: The live site serves what was built
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
          APP_PATH: ${{ needs.build.outputs.app-path }}
          CONFIG_SHA256: ${{ needs.build.outputs.config-sha256 }}
          SW_SHA256: ${{ needs.build.outputs.sw-sha256 }}
        run: |
          base="${PAGE_URL%/}/$APP_PATH"
          live() { curl -fsS -H 'Cache-Control: no-cache' "$base$1?verify=$GITHUB_RUN_ID-$2" | sha256sum | cut -d' ' -f1; }
          for attempt in $(seq 1 30); do
            config=$(live config.js "$attempt" || true)
            sw=$(live sw.js "$attempt" || true)
            if [ "$config" = "$CONFIG_SHA256" ] && [ "$sw" = "$SW_SHA256" ]; then
              echo "Live config.js and sw.js match the build (attempt $attempt)."; exit 0
            fi
            echo "Attempt $attempt: live files differ from the build; waiting."; sleep 10
          done
          echo "::error::The live config.js or sw.js still differs from the build after 5 minutes. Roll back: ops/runbooks/pwa.md"
          exit 1
