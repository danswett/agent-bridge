name: CodeQL

# Static analysis of the product's code and of these workflows (quality/README.md, §3.3, "Supply
# chain"): C#, the PWA's and tools' JavaScript, and GitHub Actions. Results go to the Security
# tab. On a pull request, code scanning's own "CodeQL" check compares them with main's and fails
# only on alerts the pull request adds, at GitHub's default threshold (high or critical security
# alerts, and errors), so findings already on main never turn a pull request red. The weekly run
# picks up new queries and advisories while nothing is merged.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 13:41 UTC: early morning Pacific, off the hour.
    - cron: '41 13 * * 1'

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  # A newer push to a pull request supersedes its analysis; main's and the weekly run all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # check out the code
      security-events: write # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        # build-mode none everywhere: C# is analysed from source, so this needs none of the
        # product's build steps (some of which only run on Windows).
        language: [csharp, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Without a build, CodeQL still resolves the C# projects' NuGet references to name types
      # it would otherwise guess at; that needs the SDK the projects target.
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
