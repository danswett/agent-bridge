name: Relay deploy

# Builds the relay image once per commit, rolls it onto staging, smoke-tests it there, and
# only then offers it to production, which waits for a person to approve (the production
# environment's required reviewer). Rollback is a workflow_dispatch with the digest of an image
# production ran before (infra/rollback-target.sh).
# No long-lived Azure secret is stored anywhere: every job that touches Azure signs in with GitHub
# OIDC, and each environment has its own principal with rights over its own app only.
# Infra itself (infra/) is applied by a person with infra/deploy.ps1; see docs/relay-deploy.md.
on:
  push:
    branches: [main]
    paths:
      - 'src/AgentBridge.Relay/**'
      - 'src/AgentBridge.Transport/**'
      - 'tools/AgentBridge.RelaySmoke/**'
      - 'infra/**'
      - 'nuget.config'
      - '.github/workflows/relay.yml'
  # Not on a draft, which runs only ci.yml's fast ring (quality/README.md §2): ready for review
  # runs it on the same head. Skipping infra skips build, and with it scan and staging.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/AgentBridge.Relay/**'
      - 'src/AgentBridge.Transport/**'
      - 'tools/AgentBridge.RelaySmoke/**'
      - 'infra/**'
      - 'nuget.config'
      - '.github/workflows/relay.yml'
  workflow_dispatch:
    inputs:
      rollback_to:
        description: 'Roll production back to the image with this digest (sha256:...), one a production revision ran; the production job''s summary lists the one it replaced. Empty: build and deploy this commit.'
        required: false
        default: ''

# id-token: write only on the jobs that sign in to Azure (build, staging, production, rollback).
# It used to be granted here, for the whole workflow, which let `infra`, a job that only compiles
# the templates, mint an Azure OIDC token too (#360).
permissions:
  contents: read

env:
  RESOURCE_GROUP: rg-agent-bridge-relay
  REGISTRY: abrelaywus2
  IMAGE: agent-bridge-relay
  STAGING_APP: agent-bridge-relay-staging
  STAGING_VAULT: kv-abrelay-stg-wus2
  PRODUCTION_APP: agent-bridge-relay
  PWA_ORIGIN: https://danswett.github.io

jobs:
  infra:
    # The templates compile, on every change, before anything is deployed. Not on a draft (above).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: A rollback goes only to an image production ran before
        run: bash infra/test-rollback-target.sh
      - run: |
          az bicep install
          az bicep build -f infra/main.bicep --stdout > /dev/null
          az bicep build-params -f infra/regions/westus2.bicepparam --stdout > /dev/null

  build:
    # RELAY_DEPLOY (a repository variable) is set once Azure and OIDC are configured; a fresh
    # clone without it only compiles the templates. A fork's pull request is kept from Azure by
    # GitHub, not by this condition: it runs with a read-only token, no OIDC token and no
    # secrets. The head-repository check only skips the job there instead of failing it.
    # Never for Dependabot: its grouped action bumps edit this file, its branches are in this
    # repository, and its runs get this job's id-token grant, so an unreviewed new action release
    # would run with the staging principal (AcrPush, the staging app, staging's token key). Both
    # the actor and the pull request's author are checked: a person pushing to a Dependabot
    # pull request's branch becomes the run's actor, but the author is still Dependabot. And no
    # dependabot/ ref either, whoever runs it: a maintainer re-pushing a Dependabot branch, or a
    # workflow_dispatch on one, would otherwise pass both checks (#418).
    if: >-
      vars.RELAY_DEPLOY == 'true' && inputs.rollback_to == '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' &&
      !startsWith(github.head_ref || github.ref_name, 'dependabot/')
    needs: infra
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write # azure/login's OIDC sign-in
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: push
        run: |
          az acr login -n "$REGISTRY"
          ref="$REGISTRY.azurecr.io/$IMAGE:$GITHUB_SHA"
          docker build -f src/AgentBridge.Relay/Dockerfile -t "$ref" .
          docker push "$ref"
          # Deploy by digest: a tag can be overwritten, a digest is the bytes staging tested.
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$ref")
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          echo "Image: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
      # The pushed image, handed to scan: scanning it here would run a third-party scanner in the
      # job that can sign in as the staging principal.
      - name: Save the image for scan
        run: docker save "$REGISTRY.azurecr.io/$IMAGE:$GITHUB_SHA" | gzip -1 > "$RUNNER_TEMP/relay-image.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relay-image
          path: ${{ runner.temp }}/relay-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  scan:
    # The image build pushed, before staging runs it (quality/README.md §3.3, container-scan), at
    # ci.yml's threshold: a high or critical vulnerability with a fix available fails it, and then
    # neither staging nor production gets this image. A vulnerability published
    # between a pull request's checks and its merge is caught here. To accept one for a while,
    # list it in .trivyignore with a reason and an exp: date. Rollback is not scanned: it rolls
    # back to an image that already ran. Also the image's CycloneDX SBOM, which attest binds to
    # its digest on main. No Azure sign-in and no id-token: it only reads the saved image.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: relay-image
          path: ${{ runner.temp }}
      - uses: ./.github/actions/install-trivy
      - name: The image has no fixable high or critical vulnerability
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --input "$RUNNER_TEMP/relay-image.tar.gz"
      - name: SBOM of the image (CycloneDX)
        if: success() || failure()
        run: trivy image --format cyclonedx --output "$RUNNER_TEMP/relay-image.cdx.json" --input "$RUNNER_TEMP/relay-image.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success() || failure()
        with:
          name: relay-image-sbom
          path: ${{ runner.temp }}/relay-image.cdx.json
          if-no-files-found: ignore
          retention-days: 30

  attest:
    # Build provenance and the SBOM for the image build pushed, bound to its digest, on main only
    # (docs/relay-deploy.md: `gh attestation verify oci://<image>@<digest> -R danswett/agent-bridge`).
    # Kept in GitHub's attestation store, not pushed beside the image: the registry is unchanged.
    # Its own job, without the staging environment, so attestations: write is not given to a job
    # that can sign in to Azure, nor to a pull request's run.
    needs: [build, scan]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Signs through Sigstore with this run's OIDC identity. Azure trusts only the staging and
      # production environments' subjects, so this job's token signs in nowhere.
      id-token: write
      attestations: write
    steps:
      - id: image
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}
        run: |
          if ! [[ "$IMAGE_REF" =~ ^([a-z0-9.-]+/[a-z0-9._/-]+)@(sha256:[0-9a-f]{64})$ ]]; then echo "::error::build's image is not a digest reference"; exit 1; fi
          echo "name=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "digest=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: relay-image-sbom
          path: ${{ runner.temp }}/sbom
      - name: Attest the image's build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
      - name: Attest the image's SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom/relay-image.cdx.json

  staging:
    needs: [build, scan]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.roll.outputs.url }}
    concurrency:
      # One rollout at a time on the shared staging app; a newer one waits, never cancels.
      group: relay-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # azure/login's OIDC sign-in
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: roll
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update -g "$RESOURCE_GROUP" -n "$STAGING_APP" --image "$IMAGE_REF" \
            --set-env-vars "Relay__Version=$GITHUB_SHA" --query properties.latestRevisionName -o tsv
          fqdn=$(az containerapp show -g "$RESOURCE_GROUP" -n "$STAGING_APP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        env:
          RELAY_URL: ${{ steps.roll.outputs.url }}
        run: |
          # Staging's own token key (never production's): the smoke test mints a token for a
          # throwaway account and connects two devices with it. Staging has its blob store
          # (infra/modules/blob-store.bicep), so a multi-MB blob goes up and down through it too,
          # once from memory and once streamed from a file as a session transfer sends one.
          key=$(az keyvault secret show --vault-name "$STAGING_VAULT" -n token-key --query value -o tsv)
          echo "::add-mask::$key"
          RELAY_SMOKE_TOKEN_KEY="$key" dotnet run --project tools/AgentBridge.RelaySmoke -c Release -- \
            --relay "$RELAY_URL" --origin "$PWA_ORIGIN" --expect-version "$GITHUB_SHA" --expect-push --expect-blobs --wait 300

  production:
    needs: [build, staging]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Waits for approval: the environment's required reviewer, and main only.
    environment:
      name: production
      url: ${{ steps.roll.outputs.url }}
    concurrency:
      group: relay-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # azure/login's OIDC sign-in
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: roll
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}
        run: ./infra/roll-production.sh "$IMAGE_REF" "$GITHUB_SHA"
      - name: Smoke test, without a token (nothing on production is signed by CI)
        env:
          RELAY_URL: ${{ steps.roll.outputs.url }}
        run: |
          dotnet run --project tools/AgentBridge.RelaySmoke -c Release -- \
            --relay "$RELAY_URL" --origin "$PWA_ORIGIN" --expect-version "$GITHUB_SHA" --expect-push --wait 180

  rollback:
    if: vars.RELAY_DEPLOY == 'true' && inputs.rollback_to != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.roll.outputs.url }}
    concurrency:
      group: relay-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # azure/login's OIDC sign-in
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # By digest, and only to one a production revision ran: never a registry tag, which anyone
      # holding staging's AcrPush could have pushed again (#418).
      - id: target
        env:
          DIGEST: ${{ inputs.rollback_to }}
        run: ./infra/rollback-target.sh "$DIGEST"
      - id: roll
        env:
          IMAGE_REF: ${{ steps.target.outputs.image }}
          VERSION: ${{ steps.target.outputs.version }}
        run: ./infra/roll-production.sh "$IMAGE_REF" "$VERSION"
      - name: Smoke test
        env:
          VERSION: ${{ steps.target.outputs.version }}
          RELAY_URL: ${{ steps.roll.outputs.url }}
        run: |
          dotnet run --project tools/AgentBridge.RelaySmoke -c Release -- \
            --relay "$RELAY_URL" --origin "$PWA_ORIGIN" --expect-version "$VERSION" --expect-push --wait 180
