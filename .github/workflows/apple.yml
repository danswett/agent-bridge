name: Apple clients

on:
  pull_request:
    paths: ['apple/**', '.github/workflows/apple.yml']
  push:
    branches: [main]
    paths: ['apple/**', '.github/workflows/apple.yml']

permissions:
  contents: read

jobs:
  native-clients:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install project and formatting tools
        run: brew install xcodegen swiftformat
      - name: Test the protocol and local socket; build both native apps
        run: bash apple/scripts/verify.sh
