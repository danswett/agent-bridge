name: Apple clients

on:
  pull_request:
    paths: ['apple/**', '.github/workflows/apple.yml']
  push:
    branches: [main]
    paths: ['apple/**', '.github/workflows/apple.yml']

permissions:
  contents: read

# A newer push to a pull request cancels its older run (as in ci.yml, #431): a superseded run on
# a macOS runner only holds capacity other work is queued for. A push to main is grouped by its
# own run id, so it is never grouped with another run and never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-clients:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install project and formatting tools
        run: brew install xcodegen swiftformat
      - name: Test the protocol and local socket; build both native apps
        run: bash apple/scripts/verify.sh
