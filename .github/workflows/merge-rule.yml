name: Merge rule

# Posts the commit status `merge-rule` on each open pull request into main (AGENTS.md, "Pull
# requests"; quality/README.md §4.9). Main's ruleset requires it beside quality-gate, so with
# auto-merge on, GitHub merges a pull request only when this says success: main's CI green (or the
# pull request labelled fixes-main), not a draft, no hold label, a Copilot review of the exact
# head, CodeQL green, every other check and status on the head passed, and, when the change
# touches a sensitive path, an independent review's receipt on the exact head.
#
# The pull request under judgement must not be able to loosen its own gate (#487, Finding 1). So
# every trigger here runs main's copy of this workflow, the job checks out main and builds main's
# evaluator, which reads main's quality/merge-rule.yml, and the pull request is only ever read
# through the API: its code is never checked out, built or run.
#  - pull_request_target: opened, pushed to, reopened, ready or back to draft, retargeted (edited),
#    labelled or unlabelled.
#  - status: a receipt or any other status posted on a head. The App's own merge-rule posts do
#    start a run (only GITHUB_TOKEN's events don't), so the job skips status events for the
#    merge-rule context: they'd only re-judge what was just judged.
#  - workflow_run: any other workflow started or finished on a pull request. Started, so a new run
#    or a rerun on an already-green head turns the verdict pending at once (Perf, dispatched by
#    hand, is required by nothing else); finished, so a late red flips it. A test keeps the list
#    complete. That includes the review relay in merge-rule-review.yml: pull_request_review runs
#    the pull request's copy of a workflow, which mustn't post statuses. And CI's push run on main
#    being requested, started and finished, so every verdict follows main going red or green
#    again (main_green); a queued or running run counts as found, which ends the window where a
#    judgement made seconds after a merge saw no run yet and held every pull request until it ended.
#  - check_suite: a check from an app other than GitHub Actions finished (code
#    scanning's CodeQL). Actions' own suites start no check_suite workflow, hence workflow_run.
#  - schedule and workflow_dispatch: a backstop for anything the events missed. That includes
#    Dependabot's: runs it triggers may get a read-only token, so their posts can fail (allowed
#    below), and the next scheduled run posts instead.
# An event about one pull request or head judges only that head (--pr or --sha); the schedule,
# dispatch and main's own CI finishing sweep every open pull request into main. The run uses a
# built evaluator cached per its source and doesn't wait for a burst to settle. Setting the
# repository variable FLEET_MERGERULE to `off` (read on every run) puts back the earlier path:
# the 45 s wait, a build of main's evaluator, and every run judging every pull request.
# Verdicts are the evaluator's, the same on both paths (quality/README.md §4.9, #1251).

on:
  # Safe as a pull_request_target and workflow_run workflow because it never checks out, builds or
  # runs the pull request's code (above).
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, labeled, unlabeled]
  status:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Apple clients, Beta acceptance, CI, CodeQL, Dependencies, Epic dashboard, Flake hunt, HA contract drift, IaC scan, Lab nightly (held), Lab release verification (held), Merge rule review relay, Ops probe, Pages, Perf, Re-run known flakes, Relay deploy, Update gap, Upload release halt policy, Weekly quality report, Workflow lint]
    types: [requested, in_progress, completed]
  check_suite:
    types: [completed] # the only type Actions accepts here
  schedule:
    # Every 10 minutes. GitHub may run it later under load; the events above do the prompt work.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  # Named evaluate, not merge-rule: GitHub requires every check and status of a required name to
  # pass, so a job of that name would be one more thing for each pull request to wait on.
  evaluate:
    # Main's own runs and check suites (pushes, the weekly CodeQL, a dispatch on main) start no
    # evaluation: no pull request's head is on main. But a push run of CI finishing on main does:
    # main going red fails every pull request (but a fixes-main one), and going green again frees
    # them (quality/merge-rule.yml, main_green). So does one being requested or started: the
    # evaluator counts a queued or running run as found. Every other completion does too, whatever its
    # event: Perf dispatched on a pull request's branch counts toward the verdict too.
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch != 'main' || github.event.workflow_run.head_repository.full_name != github.repository
      || (github.event.workflow_run.name == 'CI' && github.event.workflow_run.event == 'push'))
      && (github.event_name != 'check_suite' || github.event.check_suite.head_branch != 'main')
      && (github.event_name != 'status' || github.event.context != 'merge-rule')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The merge-rule App's key lives in this environment, which only main may deploy from
    # (docs/merge-rule-app.md): a pull request's own workflow can't reach it, so it can't post a
    # merge-rule the ruleset accepts. With GITHUB_TOKEN it could, since every workflow posts as
    # GitHub Actions and the ruleset couldn't tell them apart.
    environment: merge-rule
    permissions:
      contents: read # check out main
      pull-requests: read # the pull requests, their files, labels and reviews
      checks: read # every check run on the head
      actions: read # which workflow each of the head's check suites belongs to
      statuses: read # the receipts; merge-rule itself is posted with the App's token
    # A Dependabot-triggered run gets neither the environment's secret nor a writable token, so it
    # can't mint the App's token; that mustn't turn the run red when the schedule posts in its place.
    continue-on-error: ${{ github.actor == 'dependabot[bot]' }}
    # One group for every writer, fast path or kill switch alike: no two evaluations read main's CI
    # and post on the same head at once, so an older read of main can never land after a newer
    # verdict (a red main can't be overwritten by a run that saw it green). Nothing cancels, so a
    # sweep is never cut short by a scoped run. GitHub keeps one waiting run per group and a newer
    # one displaces it, so a scoped run that finds main not green judges every open pull request (the
    # evaluator widens it), and a displaced scoped run's own head waits at most until the
    # next run or the 10 minute sweep, never wrong. On the job, not the workflow: a run whose `if`
    # skips the job (main's own runs) never enters the group, so it can't displace a waiting one.
    concurrency:
      group: merge-rule
      cancel-in-progress: false
    steps:
      # Kill switch: FLEET_MERGERULE=off (repository variable, read on every run) restores the
      # earlier path in full: wait, build main's evaluator, judge every pull request.
      # A push sets off a burst of events (each workflow requested, then finished). On that path,
      # waiting a little lets the rest of the burst fold into the one run that waits behind this
      # one, which keeps the GraphQL budget (GITHUB_TOKEN: 1,000 points an hour for the
      # repository) well clear: quality/README.md §4.9 has the numbers.
      - name: Let a burst of events settle
        if: vars.FLEET_MERGERULE == 'off' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: sleep 45
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Main's evaluator and rules, whatever the event; never the pull request's.
          ref: main
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      # The built evaluator, kept per its own source: the key hashes everything the build reads
      # from main's checkout, so a hit is exactly what building would produce. Only main's
      # workflow runs here, in main's cache scope, so no pull request can plant a binary. A miss
      # (main changed the evaluator) builds below, and the job saves it for the next run.
      - name: Restore main's built evaluator
        id: evaluator
        if: vars.FLEET_MERGERULE != 'off'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/AgentBridge.Quality/bin/Release/net10.0
          key: merge-rule-evaluator-${{ runner.os }}-${{ hashFiles('tools/AgentBridge.Quality/**/*.cs', 'tools/AgentBridge.Quality/*.csproj', 'nuget.config', 'global.json') }}
      - name: Build main's evaluator
        if: vars.FLEET_MERGERULE == 'off' || steps.evaluator.outputs.cache-hit != 'true'
        run: dotnet build tools/AgentBridge.Quality -c Release --nologo -v q
      # Minted after the build, so nothing the build runs holds it, and limited to posting statuses.
      - name: Mint the merge-rule App's token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MERGE_RULE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MERGE_RULE_APP_KEY }}
          permission-statuses: write
      - name: Judge and post merge-rule
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_RULE_POST_TOKEN: ${{ steps.app.outputs.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAST: ${{ vars.FLEET_MERGERULE != 'off' }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STATUS_SHA: ${{ github.event.sha }}
          SUITE_SHA: ${{ github.event.check_suite.head_sha }}
          SUITE_BRANCH: ${{ github.event.check_suite.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # Fast path: an event about one pull request or head judges only that (the evaluator
          # reads every open pull request on the head, so a shared head is still judged whole);
          # everything else sweeps. A kill-switched run always sweeps, as before.
          scope=(--all)
          if [ "$FAST" = true ]; then
            case "$EVENT" in
              pull_request_target) [ -n "$PR_NUMBER" ] && scope=(--pr "$PR_NUMBER") ;;
              status) [ -n "$STATUS_SHA" ] && scope=(--sha "$STATUS_SHA") ;;
              check_suite) [ -n "$SUITE_SHA" ] && [ "$SUITE_BRANCH" != main ] && scope=(--sha "$SUITE_SHA") ;;
              workflow_run) [ -n "$RUN_SHA" ] && [ "$RUN_BRANCH" != main ] && scope=(--sha "$RUN_SHA") ;;
            esac
          fi
          echo "Judging: ${scope[*]}"
          dotnet tools/AgentBridge.Quality/bin/Release/net10.0/agent-bridge-quality.dll merge-rule "${scope[@]}" \
            --slug "$GITHUB_REPOSITORY" --post --target-url "$TARGET_URL" --summary "$GITHUB_STEP_SUMMARY"