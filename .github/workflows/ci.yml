name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review on top of the defaults: a draft runs only the fast ring (the plan job), so
    # marking it ready must run the PR gate on the same head without waiting for another push.
    types: [opened, synchronize, reopened, ready_for_review]
  # By hand, only to prove pwa-ui's apt fallback, on a commit of its own (quality/README.md
  # §4.7); the plan job refuses anything else. A run by hand is never a release (APP_RELEASE),
  # writes no cache and runs every job (the whole ring).
  workflow_dispatch:
    inputs:
      force-apt-fallback:
        description: pwa-ui takes the Azure apt mirror off at once and downloads from https://archive.ubuntu.com (a branch other than main only)
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to a pull request cancels that pull request's older run: only the latest head's
# result counts, and a superseded run only holds runners other work is queued for. First attempts
# of pushes to main share one group, ci-main, and are never cancelled once running: at most one of
# them runs and one waits, a newer waiting push run cancelling the one waiting before it starts
# (re-runs, below, run beside them). GitHub promises no order
# between them, so nothing here relies on one: each run plans from the last commit main's CI
# passed on, so a replaced run's changes are tested with a later one (the plan job), merge-rule
# passes over a replaced run only when the newest run's commit builds on its commit, and
# otherwise blocks until it's re-run (quality/README.md §4.9), and publish's own checks keep
# releases in version and commit order (publish-gate). A re-run (attempt 2 on) never joins
# ci-main, so it can't take a waiting push run's place: like a run by hand, it's grouped by its
# own run id, never cancelled.
concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && 'ci-main' || format('{0}-{1}', github.workflow, github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The app's version. The run number only grows, for pull requests and main alike, and a re-run
  # keeps it, so every push to main packs a version above the last one published. Renaming this
  # workflow starts the count again at 1: below every release, which installed copies would
  # never take (docs/app-windows.md, "Releases and updates").
  APP_VERSION: 0.1.${{ github.run_number }}
  # 'true' exactly when this run's package may be published (the publish-gate job's condition,
  # which also needs the app built here): only then is the host a release build, whose Home
  # Assistant connector may write to a real Home Assistant (design G6). Every pull request and
  # fork builds a dev host.
  APP_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'danswett/agent-bridge' }}
  # 'true' when this run's package is to be signed with Azure Artifact Signing (#734): the publish
  # path, once the owner has set the repository variable APP_SIGNING to 'true' (docs/app-windows.md,
  # Signing). Then a package that is not signed by the pinned publisher fails the run rather than
  # going out unsigned. Until then, and on every pull request and fork, packages are unsigned.
  APP_SIGNING: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'danswett/agent-bridge' && vars.APP_SIGNING == 'true' }}

jobs:
  plan:
    # What this run tests (quality/README.md §4): the selector reads quality/catalog.yml and the
    # change, and each job below runs only when a suite it runs is selected. A ready pull request
    # is ring 1 over what merging it adds. A push to main is ring 1 too, over everything since the
    # last commit main's CI passed on, so a commit whose own run was replaced while pending, or
    # failed, is tested with this one; when that commit can't be found, main runs the whole ring.
    # A draft pull request is the fast ring: ring 0 on Linux, so a work in progress holds one or
    # two runners, not a dozen; ready for review runs ring 1 on the same head.
    # A change to CI, the catalog, the selector or the build runs the whole ring (ring 2: every
    # gated job and step), decided here and not by the code it changes (#487). First, the catalog
    # must be complete, or the selection could be silently wrong.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # a run by hand checks its commit is no open pull request's head
      actions: read # main's last passed CI run, the base its plan diffs from
    outputs:
      # 'true' when every gated job and step runs whatever the selector says: when a ready pull
      # request or main's change touches what decides selection, when main's base is unknown, and
      # on a run by hand (the whole-ring step below).
      whole-ring: ${{ steps.whole-ring.outputs.whole-ring }}
      product: ${{ steps.select.outputs.product }}
      ha-integration: ${{ steps.select.outputs.ha-integration }}
      spikes: ${{ steps.select.outputs.spikes }}
      spikes-linux: ${{ steps.select.outputs.spikes-linux }}
      app: ${{ steps.select.outputs.app }}
      light: ${{ steps.select.outputs.light }}
      pwa-ui: ${{ steps.select.outputs.pwa-ui }}
      pwa-e2e: ${{ steps.select.outputs.pwa-e2e }}
      suites: ${{ steps.select.outputs.suites }}
      test-projects: ${{ steps.select.outputs.test-projects }}
      # The whole ring is the whole solution on all three runners, without asking the selector.
      whole-solution: ${{ steps.whole-ring.outputs.whole-ring == 'true' && 'true' || steps.select.outputs.whole-solution }}
      product-os: ${{ steps.whole-ring.outputs.whole-ring == 'true' && (github.event_name == 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","windows-latest","windows-11-arm"]') || steps.select.outputs.product-os }}
      test-filter: ${{ steps.select.outputs.test-filter }}
    steps:
      # A run by hand exists only to prove pwa-ui's apt fallback (force-apt-fallback), and its
      # checks, quality-gate among them, land on the commit it runs: on an open pull request's
      # head they would stand in for that pull request's own run (the merge rule reads the latest
      # run per head). So it must ask for the fallback, on a branch other than main (which
      # publishes), at a commit that is neither main's head nor any open pull request's. Anything
      # else fails here, before checkout, and every job after the plan is skipped. Push and pull
      # request runs skip this step, so they make no API call.
      - name: A run by hand is a fallback proof on a commit of its own
        if: github.event_name == 'workflow_dispatch'
        env:
          FORCE: ${{ inputs.force-apt-fallback }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          fail() { echo "::error title=force-apt-fallback::$1"; exit 1; }
          [ "$FORCE" = true ] || fail "a run by hand is only for force-apt-fallback=true"
          if [ "$REF" = refs/heads/main ] || [ "${REF#refs/heads/}" = "$REF" ]; then
            fail "only on a branch other than main, not $REF"
          fi
          main=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha) || fail "couldn't read main's head"
          [[ "$main" =~ ^[0-9a-f]{40}$ ]] || fail "couldn't read main's head"
          [ "$SHA" != "$main" ] || fail "$SHA is main's head; prove on a new commit of its own"
          gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --jq '.[].head.sha' > "$RUNNER_TEMP/pr-heads" || fail "couldn't list the open pull requests"
          while read -r head; do
            [[ "$head" =~ ^[0-9a-f]{40}$ ]] || fail "couldn't read the open pull requests' heads"
            [ "$head" != "$SHA" ] || fail "$SHA is an open pull request's head; prove on a new commit of its own"
          done < "$RUNNER_TEMP/pr-heads"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # A pull request's checkout is its merge commit, whose first parent is the base it merges
          # into, so the change is HEAD^1..HEAD: what merging adds, even when the branch is behind;
          # two commits are enough. Main diffs from its last passed commit, which may be any
          # number of commits back, so it fetches the whole history.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '2' }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      # Before anything from the change runs. A selector, catalog or workflow under change must not
      # choose what tests it: one bug in ChangedFiles, or a line moving quality/** into
      # no_test_paths, once let a change pass a gate that ran nothing (#487). So the paths that
      # decide selection, and the solution and build roots every job builds from, are fixed here,
      # and a ready pull request or a push to main that touches any of them runs ring 2: every
      # gated job and step, on every runner, whatever the selector says. A draft keeps its fast
      # ring; its gate is not the required check. Its own step, so nothing the change runs can
      # write these outputs, the base included.
      # Main's base is the newest commit main's CI passed on (a push run, at any attempt) that is
      # an ancestor of this one: a pending run replaced in ci-main tested nothing, and a failed
      # one proved nothing, so their changes are in this diff. A base found but older than
      # needed only tests more. None found, or the runs unreadable, never reads as "no change":
      # the whole ring runs.
      # The paths come NUL-separated (-z): without it git quotes a path holding ", \, a tab or
      # another control character, and the quoted form, starting with ", slipped past the anchors
      # below (tools/AgentBridge.Quality/a"b.cs left the whole ring off). Fail closed as well: a
      # path that still starts with " or holds a control or undecodable character counts as one.
      # A pull request runs its own ci.yml, so it can edit this step too: a .github/ change stays
      # under the standing rule of an independent review and a check that ring 2 ran
      # (quality/README.md §4.7).
      - name: Whole ring, when the change touches what decides selection
        id: whole-ring
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $roots = '^(\.github|quality|tools/AgentBridge\.Quality|tests/AgentBridge\.Quality\.Tests|build)/|(^|/)(Directory\.[^/]+\.(props|targets)|[^/]+\.slnx?|global\.json|nuget\.config)$'
          $odd = '^"|[\x00-\x1f\x7f\uFFFD]'
          $base = 'HEAD^1'
          $known = $env:EVENT -eq 'pull_request'
          if ($env:EVENT -eq 'push') {
            $passed = @(gh api "repos/$env:REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=100" --jq '.workflow_runs[].head_sha')
            if ($LASTEXITCODE) {
              "::warning title=plan::couldn't read main's passed CI runs, so the whole ring runs"
            } else {
              foreach ($sha in $passed) {
                if ($sha -notmatch '^[0-9a-f]{40}$') { "::warning title=plan::unreadable run head '$sha', so the whole ring runs"; break }
                if ($sha -eq $env:SHA) { continue }
                git merge-base --is-ancestor $sha HEAD
                if ($LASTEXITCODE -eq 0) { $base = $sha; $known = $true; break }
              }
            }
            $said = if ($known) { "Main's change since ``$base``, the last commit its CI passed on." } else { "**No ancestor of this commit passed main's CI** (among the latest 100 passed runs), so the whole ring runs." }
            $said | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }
          $out = git diff -z --name-only --no-renames $base HEAD
          if ($LASTEXITCODE) { throw "git diff $base HEAD failed ($LASTEXITCODE)" }
          # PowerShell splits native output into lines; a path with a newline in it is put back.
          $changed = @((@($out) -join "`n") -split "`0" | Where-Object { $_ })
          $touched = @($changed | Where-Object { $_ -match $roots -or $_ -match $odd })
          # A run by hand, and main without a known base, run everything.
          $whole = if (-not $known) { $true } elseif ($env:DRAFT -eq 'true') { $false } else { $touched.Count -gt 0 }
          "whole-ring=$($whole.ToString().ToLowerInvariant())" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
          "base=$base" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
          if ($known -and $touched.Count -gt 0) {
            $shown = ($touched | Select-Object -First 10 | ForEach-Object { '`' + ($_ -replace '[\x00-\x1f\x7f`]', '?') + '`' }) -join ', '
            if ($touched.Count -gt 10) { $shown += " (+$($touched.Count - 10) more)" }
            $what = if ($whole) { 'so the whole ring runs (ring 2: every gated job and step)' } else { 'so marking it ready runs the whole ring' }
            "**This change touches what decides selection**, ${what}: $shown." | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }
      - name: Build the selector
        run: dotnet build tools/AgentBridge.Quality -c Release --nologo -v q
      - name: The catalog is complete
        run: dotnet tools/AgentBridge.Quality/bin/Release/net10.0/agent-bridge-quality.dll check
      - name: What runs and why
        id: select
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          WHOLE_RING: ${{ steps.whole-ring.outputs.whole-ring }}
          # HEAD^1 on a pull request (its merge commit's base); on main, its last passed commit.
          BASE: ${{ steps.whole-ring.outputs.base }}
          # The jobs gated below; plan.ps1 gives each a true or false output. The catalog check
          # fails when this list, the jobs whose if: reads the plan, the plan's outputs and
          # quality-gate's needs disagree (quality/README.md §4.7).
          JOBS: product ha-integration spikes spikes-linux app light pwa-ui pwa-e2e
        run: |
          $jobs = @($env:JOBS -split '\s+' | Where-Object { $_ })
          if ($env:EVENT -eq 'pull_request' -and $env:DRAFT -eq 'true') {
            ./quality/plan.ps1 -FastRing -Base $env:BASE -Head HEAD -Jobs $jobs
          } elseif ($env:EVENT -eq 'pull_request') {
            # A pull request: the windows-11-arm product leg and the app's packaging legs run
            # when the change calls for them (the app only for a reason of its own), and on main.
            $ring = if ($env:WHOLE_RING -eq 'true') { 2 } else { 1 }
            ./quality/plan.ps1 -Ring $ring -Base $env:BASE -Head HEAD -CompareRing1:($ring -gt 1) -Narrow app -ExcludePlatform win-arm64 -Jobs $jobs
          } else {
            $ring = if ($env:WHOLE_RING -eq 'true') { 2 } else { 1 }
            ./quality/plan.ps1 -Ring $ring -Base $env:BASE -Head HEAD -CompareRing1:($ring -gt 1) -Jobs $jobs
          }

  product:
    # The product itself (src/, tests/), separate from the spikes. Windows and Linux,
    # since nothing in it may depend on Windows, and Windows on Arm, which the Arm64 package
    # runs on: the injector's console calls and the hook are tried there natively (#222).
    # On a pull request and on main, only the selected test projects, on the systems their suites
    # declare (quality/catalog.yml platforms), and only the shipped-binary checks that were selected.
    needs: plan
    if: needs.plan.outputs.whole-ring == 'true' || needs.plan.outputs.product == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.product-os) }}
    runs-on: ${{ matrix.os }}
    # A clean run takes about five minutes. The Linux test step has hung in dotnet test for hours
    # (#129); this caps what a hang can cost.
    timeout-minutes: 30
    env:
      SUITES: ${{ needs.plan.outputs.suites }}
      WHOLE_RING: ${{ needs.plan.outputs.whole-ring }}
      TEST_PROJECTS: ${{ needs.plan.outputs.test-projects }}
      WHOLE_SOLUTION: ${{ needs.plan.outputs.whole-solution }}
      # Ring 0's filter on a draft's fast ring, and nothing anywhere else, whatever the plan said.
      TEST_FILTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && needs.plan.outputs.test-filter || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Choose what to test
        # The whole solution when the whole ring runs (a change to the solution, a workflow or
        # quality/, or main with no passed base), as before. Otherwise a solution filter of the selected test
        # projects. The AOT checks below run their test projects too; the catalog gives those
        # suites their project, so it's here.
        shell: pwsh
        run: |
          if ($env:WHOLE_SOLUTION -eq 'true') {
            $target = 'AgentBridge.slnx'
          } elseif (($tests = @($env:TEST_PROJECTS | ConvertFrom-Json)).Count -eq 0) {
            $target = ''
          } else {
            # The catalog's check makes sure each folder holds exactly one project.
            $projects = @($tests | ForEach-Object { "$_/" + (Get-ChildItem $_ -Filter *.csproj).Name })
            $target = Join-Path $env:RUNNER_TEMP selected.slnf
            @{ solution = @{ path = (Resolve-Path AgentBridge.slnx).Path; projects = $projects } } | ConvertTo-Json -Depth 3 | Set-Content $target
            Write-Host "selected.slnf: $($projects -join ', ')"
          }
          "DOTNET_TARGET=$target" | Add-Content $env:GITHUB_ENV
      # NuGet's packages, and the local dotnet tools that restore into the same folder, come from a
      # cache only main writes (#459): a pull request restores main's, never saves, and GitHub keeps
      # a pull request's caches out of main's reach anyway. On a pull request whose project files
      # differ, the nearest main cache is a starting point and NuGet fetches the rest; main itself
      # restores only an exact match, so what it saves never accumulates stale packages.
      - name: NuGet packages from main's cache
        id: nuget
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/Directory.*', '**/nuget.config', '.config/dotnet-tools.json', '**/global.json') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('nuget-{0}-{1}-{2}-', github.job, runner.os, runner.arch) || '' }}
      # dotnet-coverage and ReportGenerator, pinned in .config/dotnet-tools.json.
      - run: dotnet tool restore
        if: env.DOTNET_TARGET != ''
      # Built apart from the tests so coverage is collected from the tests alone, not from MSBuild
      # and the compiler too. Always the whole solution, even when only some tests run: projects
      # no test references (the benchmarks, perf-hook's driver) are compiled nowhere else on a
      # pull request, and one broken there would first fail main's build.
      - run: dotnet build AgentBridge.slnx -c Release --nologo
        timeout-minutes: 10
      - name: Save NuGet packages to main's cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.nuget.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget.outputs.cache-primary-key }}
      # --blame-hang: a test running five minutes is a hang (none takes one); its test host is dumped
      # and killed, and the run fails naming the test in progress, instead of stalling the job.
      # dotnet-coverage follows every process the test hosts start (the host, hook and injector
      # run as real processes in several tests), which a per-project collector would miss, and
      # needs no package in the test projects. Coverage and the TRX timings are only reported
      # (quality/README.md §5): nothing here fails the run but the tests themselves. TEST_FILTER is
      # ring 0's in-process filter on a draft (the fast ring), and empty otherwise: every test runs.
      - name: dotnet test, with coverage and per-test times
        if: env.DOTNET_TARGET != ''
        shell: pwsh
        run: |
          $filter = if ($env:TEST_FILTER) { " --filter `"$env:TEST_FILTER`"" } else { '' }
          dotnet tool run dotnet-coverage collect --nologo -s build/coverage.settings.xml -f cobertura -o TestResults/coverage.cobertura.xml "dotnet test $env:DOTNET_TARGET -c Release --no-build --nologo --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini --results-directory TestResults --logger trx$filter"
        timeout-minutes: 20
        env:
          DOTNET_COVERAGE_TELEMETRY_OPTOUT: '1'
      - name: Coverage and timing report
        # Also after a failure: the slowest tests are most useful then. A fault in the report
        # itself must not fail the build, since nothing is gated on coverage yet.
        if: (success() || failure()) && env.DOTNET_TARGET != ''
        continue-on-error: true
        shell: pwsh
        # The matrix now comes from the plan's output, so it reaches the script as data, not code.
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          if (Test-Path TestResults/coverage.cobertura.xml) {
            dotnet tool run reportgenerator -reports:TestResults/coverage.cobertura.xml -targetdir:TestResults/coverage-report "-reporttypes:Cobertura;JsonSummary;Html" "-title:agent-bridge $env:MATRIX_OS"
          }
          pwsh -NoProfile -File build/test-report.ps1 -CoverageSummary TestResults/coverage-report/Summary.json -TestResults TestResults -Title ".NET tests: $env:MATRIX_OS" >> $env:GITHUB_STEP_SUMMARY
      - name: Keep the coverage report and test results
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.os }}
          path: |
            TestResults/coverage-report/
            TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep the hang dumps
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-hang-${{ matrix.os }}
          path: |
            TestResults/**/*.dmp
            TestResults/**/Sequence_*.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: The NativeAOT injector types into a real console
        # The same integration tests again, against the worker as it ships.
        if: runner.os == 'Windows' && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'injector-aot'))
        shell: pwsh
        run: |
          $rid = if ($env:RUNNER_ARCH -eq 'ARM64') { 'win-arm64' } else { 'win-x64' }
          dotnet publish src/AgentBridge.Injector -c Release -r $rid -o "$env:RUNNER_TEMP/injector" --nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:AGENT_BRIDGE_INJECTOR = "$env:RUNNER_TEMP/injector/agent-bridge-injector.exe"
          dotnet test tests/AgentBridge.Host.Delivery.Tests -c Release --no-build --nologo --filter "FullyQualifiedName~InjectorIntegrationTests"
      - name: The shadow install leaves the previous one running when it fails
        # Against stand-ins for the scheduled tasks, dotnet and the host: nothing is registered.
        if: runner.os == 'Windows' && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'build-scripts'))
        shell: pwsh
        run: pwsh -NoProfile -File build/test-shadow-week.ps1
      - name: Publishing makes one pre-release per version and prunes only old pre-releases
        # Against stand-ins for gh, vpk and dotnet: nothing is uploaded or deleted.
        if: runner.os == 'Windows' && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'build-scripts'))
        shell: pwsh
        run: pwsh -NoProfile -File build/test-publish-prerelease.ps1
      - name: The NativeAOT hook replies and spools as an agent runs it
        # The hook every agent waits on, as it ships: NativeAOT, started fresh for each event.
        if: runner.os == 'Windows' && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'hook-aot'))
        shell: pwsh
        run: |
          $rid = if ($env:RUNNER_ARCH -eq 'ARM64') { 'win-arm64' } else { 'win-x64' }
          dotnet publish src/AgentBridge.Hook -c Release -r $rid -o "$env:RUNNER_TEMP/hook" --nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:AGENT_BRIDGE_HOOK = "$env:RUNNER_TEMP/hook/agent-bridge-host-hook.exe"
          dotnet test tests/AgentBridge.Hooks.Tests -c Release --no-build --nologo --filter "FullyQualifiedName~HookProcessTests" --logger "console;verbosity=normal"
      - name: Relay container builds and serves
        # Run as it ships: its own unprivileged user and a read-only file system. The first product
        # image built but crashed at start, which only running it shows. container-scan scans the image
        # this builds, so it needs this step too.
        if: runner.os == 'Linux' && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'relay-container') || contains(fromJSON(env.SUITES), 'container-scan'))
        run: |
          docker build -f src/AgentBridge.Relay/Dockerfile -t agent-bridge-relay .
          docker run -d --name relay --read-only --tmpfs /tmp -p 8080:8080 -e Relay__Version=ci agent-bridge-relay
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"version":"ci"' || { docker logs relay; exit 1; }
          curl -fsS http://127.0.0.1:8080/readyz
      # The relay image's scan (quality/README.md §3.3, container-scan). Blocking on a high or
      # critical vulnerability that has a fix, in the base image's packages or the relay's NuGet
      # packages: a rebuild on the fixed base, or a package bump, clears it. One without a fix
      # cannot be cleared here, so it is only reported (code scanning, from main). The image had no
      # high or critical finding, fixed or not, when this was added (#433). To accept one for a
      # while, list it in .trivyignore with a reason and an exp: date. The database comes first,
      # from mirror.gcr.io or else ghcr.io (install-trivy's download-db.ps1); with neither, the
      # install fails and nothing is scanned. Both scans use only that database.
      - name: Install Trivy
        if: runner.os == 'Linux' && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'container-scan'))
        uses: ./.github/actions/install-trivy
        with:
          vulnerability-db: 'true'
      - name: The relay image has no fixable high or critical vulnerability
        id: relay-scan
        if: runner.os == 'Linux' && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'container-scan'))
        run: trivy image --scanners vuln --skip-db-update --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 agent-bridge-relay
      - name: The relay image's high and critical vulnerabilities, fixed or not, as SARIF
        # Also after the scan above fails: then most of all. relay-image-sarif sends it to code
        # scanning from main.
        if: runner.os == 'Linux' && !cancelled() && steps.relay-scan.outcome != 'skipped'
        run: trivy image --scanners vuln --skip-db-update --severity HIGH,CRITICAL --format sarif --output "$RUNNER_TEMP/relay-image.sarif" agent-bridge-relay
      - name: Keep the relay image's SARIF
        if: runner.os == 'Linux' && !cancelled() && steps.relay-scan.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relay-image-sarif
          path: ${{ runner.temp }}/relay-image.sarif
          if-no-files-found: ignore
          retention-days: 14
  relay-image-sarif:
    # The relay image's scan to code scanning (the Security tab), from main only. A pull request's
    # results would be compared with main's last upload, so a vulnerability published since then
    # would show as one the pull request added and fail code scanning's check, for something the
    # pull request did not do; product's scan step is the pull request's gate. Its own job, so
    # security-events: write is not given to the job that runs every test.
    needs: product
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository == 'danswett/agent-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload the SARIF
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: sarif
        # Absent when product failed before the image was built; nothing to send then.
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: relay-image-sarif
          path: ${{ runner.temp }}/sarif
      - if: steps.sarif.outcome == 'success'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/sarif/relay-image.sarif
          category: relay-image
  ha-integration:
    # The Home Assistant connector against a real Home Assistant and Mosquitto: containers on this
    # runner, started empty, onboarded for this run (tools/ha-ci/onboard.py) and thrown away with
    # it. The disposable Home Assistant every HA connector change is checked against
    # (docs/ha-connector.md, "Validation"); nothing here can reach any other.
    needs: plan
    if: needs.plan.outputs.whole-ring == 'true' || needs.plan.outputs.ha-integration == 'true'
    runs-on: ubuntu-latest
    env:
      # The Home Assistant release the connector is checked against. Keep it at, or close to,
      # the release the real dashboard runs.
      HA_IMAGE: ghcr.io/home-assistant/home-assistant:2026.10.4
      MOSQUITTO_IMAGE: eclipse-mosquitto:2.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Start a disposable Home Assistant and Mosquitto
        run: |
          docker network create ha
          docker run -d --name mosquitto --network ha "$MOSQUITTO_IMAGE" mosquitto -c /mosquitto-no-auth.conf
          docker run -d --name homeassistant --network ha -p 127.0.0.1:8123:8123 -e TZ=UTC "$HA_IMAGE"
      - name: NuGet packages from main's cache
        id: nuget
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/Directory.*', '**/nuget.config', '.config/dotnet-tools.json', '**/global.json') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('nuget-{0}-{1}-{2}-', github.job, runner.os, runner.arch) || '' }}
      - run: dotnet build tests/AgentBridge.HomeAssistant.Tests -c Release --nologo
      - name: Save NuGet packages to main's cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.nuget.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget.outputs.cache-primary-key }}
      - name: Onboard it, with MQTT
        run: python3 tools/ha-ci/onboard.py
      - name: The connector against it
        run: dotnet test tests/AgentBridge.HomeAssistant.Tests -c Release --no-build --nologo --filter "Category=HomeAssistantIntegration" --logger "console;verbosity=normal"
      - name: Home Assistant's log
        if: failure()
        run: docker logs homeassistant 2>&1 | tail -n 300
  spikes:
    needs: plan
    if: needs.plan.outputs.whole-ring == 'true' || needs.plan.outputs.spikes == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: NuGet packages from main's cache
        id: nuget
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', '**/Directory.*', '**/nuget.config', '.config/dotnet-tools.json', '**/global.json') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('nuget-{0}-{1}-{2}-', github.job, runner.os, runner.arch) || '' }}
      - name: Build spike projects
        shell: pwsh
        run: |
          $projects = Get-ChildItem spikes -Recurse -Filter *.csproj
          foreach ($p in $projects) {
            dotnet build $p.FullName -c Release --nologo
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Save NuGet packages to main's cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.nuget.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget.outputs.cache-primary-key }}
      - name: Parse spike scripts
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem spikes -Recurse -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Error "$($f.Name): $_" }; $bad++ }
          }
          exit $bad
      - name: S3 publish carries the compiled XAML
        # The build output runs either way; only a published copy fails at startup when
        # the app's .pri is missing, so check the publish folder itself.
        shell: pwsh
        run: |
          dotnet publish spikes/s3-winui-velopack/App/AgentBridgeS3.csproj -c Release -o "$env:RUNNER_TEMP/s3" --nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:RUNNER_TEMP/s3/AgentBridgeS3.pri")) { Write-Error 'AgentBridgeS3.pri is missing from the publish output'; exit 1 }
      - name: S6 device keys
        # A runner may have no TPM; the TPM checks then report SKIP and the DPAPI ones still run.
        shell: pwsh
        run: dotnet spikes/s6-tpm-keys/src/S6.Check/bin/Release/net10.0-windows/s6-check.dll check

  app:
    # The Windows app (docs/app-windows.md): published with the host into one folder, packed
    # with Velopack, then the published copy is started in demo mode to check that it draws
    # the cards and answers one through them. The package here is always unsigned, an artifact for
    # testing: this job builds and runs the source, so it never holds the signing identity. With
    # APP_SIGNING it also hands its publish folder to the sign job, which packs and signs that
    # same folder (docs/app-windows.md, Signing).
    # Once per architecture, each on its own (#222): x64 in Velopack's `win` channel, which every
    # copy installed before Arm64 builds reads, under the artifact name the publish job always
    # took; Arm64 in `win-arm64` (build/app-channels.ps1), built and self-tested on Arm64.
    name: app (${{ matrix.runtime }})
    needs: plan
    if: (needs.plan.outputs.whole-ring == 'true' && github.event_name != 'pull_request') || needs.plan.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            runner: windows-latest
            out: out/app
            artifact: agent-bridge-windows
          - runtime: win-arm64
            runner: windows-11-arm
            out: out/app-arm64
            artifact: agent-bridge-windows-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool install -g vpk --version 1.2.161
      - name: Publish and pack
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # -DeltaFrom: a delta from the latest release, so an installed copy downloads what changed
        # rather than the whole ~100 MB package. -ReleaseNotes: the commits since that release,
        # which an installed copy shows after it updates.
        run: |
          ./build/release-notes.ps1 -Repository "${{ github.repository }}" -Commit "${{ github.sha }}" -Out out/app/notes.md
          ./build/pack-app.ps1 -Version $env:APP_VERSION -Runtime ${{ matrix.runtime }} -Out ${{ matrix.out }} -Release:($env:APP_RELEASE -eq 'true') -DeltaFrom "https://github.com/${{ github.repository }}" -ReleaseNotes out/app/notes.md
      - name: The publish folder, for the sign job
        # Uploaded as published, before anything below runs the app from it, so the sign job packs
        # exactly the files this job built and then tested in the unsigned package.
        if: env.APP_SIGNING == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}-publish-${{ env.APP_VERSION }}
          path: ${{ matrix.out }}/publish
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Only the publish path builds a release host
        # The packed host is a release build exactly when this run publishes: dev here on a pull
        # request. And the property the publish path sets does make one, on this commit.
        shell: pwsh
        run: |
          $packed = ./build/host-identity.ps1 ${{ matrix.out }}/publish/agent-bridge-host.dll
          $wanted = if ($env:APP_RELEASE -eq 'true') { 'release' } else { 'dev' }
          Write-Output "packed host: $packed build (APP_RELEASE=$env:APP_RELEASE)"
          if ($packed -ne $wanted) { Write-Error "the packed host is a $packed build; this run wants a $wanted build"; exit 1 }
          dotnet build src/AgentBridge.Host -c Release --nologo -v q -p:AgentBridgeRelease=true -o "$env:RUNNER_TEMP/release-host"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $release = ./build/host-identity.ps1 "$env:RUNNER_TEMP/release-host/agent-bridge-host.dll"
          Write-Output "-p:AgentBridgeRelease=true host: $release build"
          if ($release -ne 'release') { Write-Error "-p:AgentBridgeRelease=true built a $release host"; exit 1 }
      - name: The published app draws the demo's cards and answers one
        shell: pwsh
        # build/app-self-test.ps1 says how the app ended when it did not end with 0 (#240).
        run: ./build/app-self-test.ps1 -Exe ${{ matrix.out }}/publish/AgentBridge.exe -Result "$env:RUNNER_TEMP/selftest/result.json" -TimeoutSeconds 480
      - name: The release would publish (dry run)
        # What the publish job would upload, publish and prune, against the repository's real
        # releases, with vpk reading the folder into a scratch feed. Read-only: nothing is uploaded.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build/publish-prerelease.ps1 -Version $env:APP_VERSION -ReleasesDir ${{ matrix.out }}/releases -Repository "${{ github.repository }}" -Commit "${{ github.sha }}" -DryRun
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}-${{ env.APP_VERSION }}
          path: ${{ matrix.out }}/releases
          retention-days: 30
      # The package's SBOM (quality/README.md §3.3, supply-chain): every NuGet package and project
      # in the published folder, read from its .deps.json files, as CycloneDX. On every build, so a
      # pull request shows it still works; publish attests it against the packages it uploads.
      - name: Install Trivy
        uses: ./.github/actions/install-trivy
      - name: SBOM of the published app (CycloneDX)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/sbom" | Out-Null
          trivy fs --format cyclonedx --output "$env:RUNNER_TEMP/sbom/agent-bridge-windows-${{ matrix.runtime }}-$env:APP_VERSION.cdx.json" "${{ matrix.out }}/publish"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          . ./build/app-notices.ps1
          Add-AppSbomLicences -Publish '${{ matrix.out }}/publish' -Version $env:APP_VERSION -Runtime '${{ matrix.runtime }}' -Sbom "$env:RUNNER_TEMP/sbom/agent-bridge-windows-${{ matrix.runtime }}-$env:APP_VERSION.cdx.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ matrix.runtime }}-${{ env.APP_VERSION }}
          path: ${{ runner.temp }}/sbom
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: app-self-test-${{ matrix.runtime }}
          path: ${{ runner.temp }}/selftest
          retention-days: 7

  app-installer:
    # The installer half of the app's checks, split out of `app` so the two ~6 minute self-tests
    # run side by side instead of one after the other (#1654). It packs the same commit with the
    # same script, then installs the Setup.exe it made and starts the installed app. Nothing here
    # is published or signed: `app` stays the job whose package ships.
    name: app-installer (${{ matrix.runtime }})
    needs: plan
    if: (needs.plan.outputs.whole-ring == 'true' && github.event_name != 'pull_request') || needs.plan.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            runner: windows-latest
            out: out/app
          - runtime: win-arm64
            runner: windows-11-arm
            out: out/app-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool install -g vpk --version 1.2.161
      - name: Publish and pack
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./build/release-notes.ps1 -Repository "${{ github.repository }}" -Commit "${{ github.sha }}" -Out out/app/notes.md
          ./build/pack-app.ps1 -Version $env:APP_VERSION -Runtime ${{ matrix.runtime }} -Out ${{ matrix.out }} -Release:($env:APP_RELEASE -eq 'true') -DeltaFrom "https://github.com/${{ github.repository }}" -ReleaseNotes out/app/notes.md
      - name: The installer installs per user, into its own channel and architecture, and the installed app starts
        # The Setup.exe a person downloads, run silently on this throwaway runner: per user, no
        # admin, into %LOCALAPPDATA%\AgentBridgeApp. A silent install starts nothing, so no host or
        # logon task is registered; the installed copy then runs the same self-test. The channel it
        # recorded is the feed it will update from, for good (build/app-channels.ps1).
        shell: pwsh
        run: |
          . ./build/app-channels.ps1
          $target = Get-AppChannel '${{ matrix.runtime }}'
          $setup = Join-Path '${{ matrix.out }}/releases' (Get-AppAssetName $target.Channel 'Installer' $env:APP_VERSION)
          $logs = "$env:RUNNER_TEMP/selftest/installed"
          New-Item -ItemType Directory -Force $logs | Out-Null
          $p = Start-Process $setup -ArgumentList '--silent', '--log', "$logs/setup.log" -PassThru
          if (-not $p.WaitForExit(300000)) { Stop-Process -Id $p.Id; Write-Error 'Setup did not finish'; exit 1 }
          if ($p.ExitCode) { Get-Content "$logs/setup.log" -ErrorAction SilentlyContinue; Write-Error "Setup exited with $($p.ExitCode)"; exit 1 }
          $root = "$env:LOCALAPPDATA/AgentBridgeApp"
          $manifest = Get-Content "$root/current/sq.version" -Raw
          Write-Output $manifest
          if ($manifest -notmatch "<channel>$([regex]::Escape($target.Channel))</channel>") { Write-Error "installed into another channel than $($target.Channel)"; exit 1 }
          # x64's Update.exe is the x86 one vpk gives a pack without --runtime, as installed copies have.
          $expected = [ordered]@{ 'current/AgentBridge.exe' = $target.Machine; 'current/agent-bridge-host.exe' = $target.Machine; 'current/agent-bridge-injector.exe' = $target.Machine; 'current/agent-bridge-host-hook.exe' = $target.Machine; 'Update.exe' = $(if ($target.Machine -eq 'x64') { 'x86' } else { $target.Machine }) }
          $bad = 0
          foreach ($file in $expected.Keys) {
            $machine = Get-PeMachine ([IO.File]::ReadAllBytes((Join-Path $root $file)))
            Write-Output "${file}: $machine"
            if ($machine -ne $expected[$file]) { Write-Error "$file is $machine, not $($expected[$file])"; $bad++ }
          }
          if ($bad) { exit 1 }
          . ./build/app-notices.ps1
          Write-AppDistributionEvidence -Publish '${{ matrix.out }}/publish' -Releases '${{ matrix.out }}/releases' -Version $env:APP_VERSION -Runtime '${{ matrix.runtime }}' -Installed "$root/current" -Out "$logs/distribution-evidence.json"
          ./build/app-self-test.ps1 -Exe "$root/current/AgentBridge.exe" -Result "$logs/result.json" -TimeoutSeconds 480
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: app-installer-self-test-${{ matrix.runtime }}
          path: ${{ runner.temp }}/selftest
          retention-days: 7

  publish-gate:
    # A main run publishes when it built and checked the app (quality-gate's app output): a run
    # whose change left the app alone, docs only say, has no packages and publishes nothing; the
    # last release stays the newest build of the app. Release order doesn't rest on the order
    # main's runs start or finish, which GitHub doesn't promise (and an old run can be re-run):
    # publish runs one at a time (its concurrency group never cancels one in progress, and keeps
    # every waiting publish rather than letting the next to arrive replace it: publish's
    # concurrency), and inside it publish-prerelease.ps1 publishes each version once, refuses a
    # version older than any published, the version being this run's number, and refuses a commit
    # that doesn't hold the latest release's commit, since neither a run number nor the order
    # waiting publishes start in says anything of commit order. So a run that publishes after a
    # newer commit's release publishes nothing, and an older commit's run that gets there first
    # publishes nothing when main's head has since changed the app (main's selector says so):
    # main's later run builds the app with both changes and publishes it, whatever the two runs'
    # numbers, where publishing the older first could leave the newer one refused as an older
    # version. Had it to be main's head instead, an app change followed by a docs-only commit
    # would never be released.
    # quality-gate must have passed: every ci.yml check job the plan selected (product, app, the
    # PWA, Home Assistant and spike jobs, light) ran and succeeded, since a release is what
    # installed copies take within the half hour. That's this workflow's jobs only; CodeQL, perf
    # and the relay workflow run apart and don't hold a release. Needing quality-gate, rather than
    # a second copy of its list, keeps the two from drifting apart (#512); the catalog check fails
    # if this need goes. !cancelled() replaces the default success(), so the result is checked here.
    needs: [quality-gate]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'danswett/agent-bridge'
      && needs.quality-gate.result == 'success' && needs.quality-gate.outputs.app == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: echo "::notice::main's CI passed with the app built at ${{ github.sha }}; publishing"

  sign:
    # Signs the release with Azure Artifact Signing (#734), in a job of its own so that only it
    # holds the signing identity: the app jobs build and run the source, and publish writes to the
    # repository, and neither can sign. Nor does this job build or run anything from the source:
    # it packs the publish folders the app jobs uploaded (pack-app.ps1 -PackOnly, which only reads
    # them), and vpk signs every executable in them, and Setup.exe, as it packs. Both
    # architectures in one job, so a release is signed whole or not at all, and pack-app.ps1 fails
    # it on any file the pinned publisher did not sign with a timestamp; publish checks every
    # signature again, before uploading and in the draft. Only for a run whose app was built and
    # checked (publish-gate), and only once the owner has set APP_SIGNING (docs/app-windows.md,
    # Signing). Without APP_SIGNING it only says so, on Linux, so publish can need it either way.
    # Release order is publish-prerelease.ps1's to keep (publish-gate), after signing as before.
    needs: [publish-gate]
    # publish-gate's result, not the implicit success() (see publish).
    if: ${{ !cancelled() && needs.publish-gate.result == 'success' }}
    # Only a signing run enters the `signing` environment, the one subject the signing identity's
    # federated credential trusts (repo:danswett/agent-bridge:environment:signing), deployable from
    # main only. Without it this job's OIDC token signs in nowhere.
    environment: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'danswett/agent-bridge' && vars.APP_SIGNING == 'true') && 'signing' || '' }}
    runs-on: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'danswett/agent-bridge' && vars.APP_SIGNING == 'true') && 'windows-latest' || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write # azure/login's OIDC sign-in, used only when APP_SIGNING is 'true'
    timeout-minutes: 30
    steps:
      - name: Unsigned
        if: env.APP_SIGNING != 'true'
        run: echo "APP_SIGNING is not set, so publish takes the app jobs' unsigned packages"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.APP_SIGNING == 'true'
        with:
          persist-credentials: false
      - name: .NET 8 runtime for Artifact Signing's signtool plug-in
        # vpk signs through signtool and the Azure.CodeSigning dlib, which runs on .NET 8.
        if: env.APP_SIGNING == 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'
      - if: env.APP_SIGNING == 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - if: env.APP_SIGNING == 'true'
        run: dotnet tool install -g vpk --version 1.2.161
      - if: env.APP_SIGNING == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-bridge-windows-publish-${{ env.APP_VERSION }}
          path: out/app/publish
      - if: env.APP_SIGNING == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-bridge-windows-arm64-publish-${{ env.APP_VERSION }}
          path: out/app-arm64/publish
      - name: Artifact Signing metadata, and the release notes
        # Which account and certificate profile sign; no credential: the dlib signs in through the
        # Azure CLI session azure/login opens below, and the key never leaves Azure's HSM. The
        # values are checked, so a missing variable fails here rather than signing nothing. The
        # notes are the app jobs' (build/release-notes.ps1), made again here rather than taken
        # from them.
        if: env.APP_SIGNING == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_ENDPOINT: ${{ vars.APP_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.APP_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.APP_SIGNING_PROFILE }}
          SIGNING_EKU: ${{ vars.APP_SIGNING_IDENTITY_EKU }}
        run: |
          . ./build/app-signing.ps1
          Assert-AppSignerEku $env:SIGNING_EKU
          New-AppSigningMetadata -Path "$env:RUNNER_TEMP/artifact-signing/metadata.json" -Endpoint $env:SIGNING_ENDPOINT -Account $env:SIGNING_ACCOUNT -CertificateProfile $env:SIGNING_PROFILE
          ./build/release-notes.ps1 -Repository "${{ github.repository }}" -Commit "${{ github.sha }}" -Out out/app/notes.md
      - name: Sign in to Azure (OIDC, no secret)
        if: env.APP_SIGNING == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.APP_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.APP_SIGNING_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Pack and sign both architectures
        # The app jobs' -DeltaFrom and -ReleaseNotes, on the folders they published. -RequireSignature
        # fails the job, and so holds back publish, on any file not signed as it must be.
        if: env.APP_SIGNING == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_EKU: ${{ vars.APP_SIGNING_IDENTITY_EKU }}
        run: |
          foreach ($build in @(@{ Runtime = 'win-x64'; Out = 'out/app' }, @{ Runtime = 'win-arm64'; Out = 'out/app-arm64' })) {
            ./build/pack-app.ps1 -Version $env:APP_VERSION -Runtime $build.Runtime -Out $build.Out -Release:($env:APP_RELEASE -eq 'true') -PackOnly -DeltaFrom "https://github.com/${{ github.repository }}" -ReleaseNotes out/app/notes.md -AzureTrustedSignFile "$env:RUNNER_TEMP/artifact-signing/metadata.json" -RequireSignature -SignerEku $env:SIGNING_EKU
          }
      - name: Sign out of Azure
        # The signing session ends with the packing; nothing after it needs Azure.
        if: always() && env.APP_SIGNING == 'true'
        shell: pwsh
        run: |
          az logout 2>$null
          az account clear 2>$null
          exit 0
      - if: env.APP_SIGNING == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-bridge-windows-signed-${{ env.APP_VERSION }}
          path: out/app/releases
          if-no-files-found: error
          retention-days: 30
      - if: env.APP_SIGNING == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-bridge-windows-arm64-signed-${{ env.APP_VERSION }}
          path: out/app-arm64/releases
          if-no-files-found: error
          retention-days: 30

  publish:
    # Every main run that built the app becomes a GitHub pre-release, which installed copies
    # update from (docs/app-windows.md, "Releases and updates"): the app jobs' packages, x64's and
    # Arm64's in one release, once the product's tests pass on every system. Never a pull request
    # and never a fork, and the only job here that can write to the repository. With APP_SIGNING,
    # the packages are the sign job's, signed, and never the app jobs' unsigned ones.
    needs: [publish-gate, sign]
    # The gate's and sign's results, not the implicit success(): that also needs every job further
    # up to have succeeded, and a check the plan skipped (PWA, Home Assistant) carries its skip
    # down past publish-gate's !cancelled(), so a checked app build would never publish (#938's
    # review). sign succeeds without signing when APP_SIGNING is off.
    if: ${{ !cancelled() && needs.publish-gate.result == 'success' && needs.sign.result == 'success' }}
    runs-on: windows-latest
    permissions:
      contents: write
    # One publish at a time: the checks against what is already out, and the delta's base, hold
    # until the release is up. queue: max keeps every waiting publish, up to 100, where the
    # default keeps one and lets the next to arrive replace it: a re-run of an old run (which
    # isn't in ci-main) could otherwise replace a newer run's waiting publish, leaving that run's
    # app unpublished (#938). A 101st is cancelled, never one already waiting. GitHub doesn't
    # promise the order waiting publishes start in, and it needn't be commit or run order, so the
    # release order is publish-prerelease.ps1's to keep (publish-gate). actionlint 1.7.12 doesn't
    # know queue: workflow-lint.yml lets that one finding, here only, through (#951).
    # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
    concurrency:
      group: publish-prerelease
      cancel-in-progress: false
      queue: max
    timeout-minutes: 30
    outputs:
      # 'true' only when this run uploaded the release: attest then signs it.
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Main's head now, under the publish lock, with its history: publish-prerelease.ps1 doesn't
      # publish a commit main has since changed the app past (main's later run publishes that),
      # read with main's own selector and catalog, as that run plans. A second clone, since the
      # first one's origin/main is this run's commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          path: main-head
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Build main's selector
        run: dotnet build main-head/tools/AgentBridge.Quality -c Release --nologo -v q
      - run: dotnet tool install -g vpk --version 1.2.161
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.APP_SIGNING == 'true' && 'agent-bridge-windows-signed' || 'agent-bridge-windows' }}-${{ env.APP_VERSION }}
          path: out/app/releases
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.APP_SIGNING == 'true' && 'agent-bridge-windows-arm64-signed' || 'agent-bridge-windows-arm64' }}-${{ env.APP_VERSION }}
          path: out/app-arm64/releases
      - name: Publish the pre-release and prune old ones
        id: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # Repository variables: this job has no environment, and needs no Azure sign-in; it
          # checks the signatures the sign job made, before uploading and again in the draft.
          SIGNING_EKU: ${{ vars.APP_SIGNING_IDENTITY_EKU }}
        run: |
          $sign = @{}
          if ($env:APP_SIGNING -eq 'true') { $sign = @{ RequireSignature = $true; SignerEku = $env:SIGNING_EKU } }
          ./build/publish-prerelease.ps1 -Version $env:APP_VERSION -ReleasesDir out/app/releases, out/app-arm64/releases -Repository "${{ github.repository }}" -Commit "${{ github.sha }}" -MainHead (git -C main-head rev-parse HEAD) -MainRepo main-head @sign
      - name: Publish the static Beta download manifest
        if: steps.publish.outputs.manifest-tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MANIFEST_TAG: ${{ steps.publish.outputs.manifest-tag }}
        run: |
          $json = gh api "repos/$env:REPOSITORY/releases/tags/$env:MANIFEST_TAG"
          if ($LASTEXITCODE) { throw "couldn't read the published Beta metadata ($LASTEXITCODE)" }
          $json | Set-Content out/beta-release-input.json -Encoding utf8NoBOM
          ./build/release-manifest.ps1 -ReleaseJson out/beta-release-input.json -Repository $env:REPOSITORY -Out out/beta-release.json -Publish

  attest:
    # Build provenance and an SBOM attestation for each package publish uploaded (quality/README.md
    # §3.3, supply-chain), so anyone can check a download with
    # `gh attestation verify <file> -R danswett/agent-bridge` (docs/app-windows.md). The subjects
    # are the release's own assets, downloaded back, since publishing may rebuild a delta after
    # it was packed. Only when this run uploaded them: a re-run that finds its version
    # already out rebuilds the app, and its SBOMs would not be of what is out. Its own job, so the
    # signing token is not in the job that runs vpk and holds contents: write. Also when publish
    # failed after uploading (pruning old releases, say): a retry would find the version out and
    # attest nothing, so this is the release's one chance.
    needs: [publish]
    if: ${{ !cancelled() && needs.publish.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # the release's assets and this run's SBOM artifacts
      # Signs through Sigstore with this run's OIDC identity. No Azure principal trusts this job's
      # subject (each trusts only its relay.yml environment, or the sign job's `signing`
      # environment), so the token signs in nowhere.
      id-token: write
      attestations: write
    steps:
      - name: Download the packages publish uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tag="v$APP_VERSION"
          # Velopack's names (build/app-channels.ps1): x64's `win` channel has no suffix.
          gh release download "$tag" -R "$REPO" -D "$RUNNER_TEMP/release/win-x64" \
            -p "*-$APP_VERSION-full.nupkg" -p "*-$APP_VERSION-delta.nupkg" -p '*-win-Setup.exe' -p '*-win-Portable.zip'
          gh release download "$tag" -R "$REPO" -D "$RUNNER_TEMP/release/win-arm64" \
            -p "*-$APP_VERSION-win-arm64-full.nupkg" -p "*-$APP_VERSION-win-arm64-delta.nupkg" -p '*-win-arm64-Setup.exe' -p '*-win-arm64-Portable.zip'
          for dir in win-x64 win-arm64; do
            for kind in '-full.nupkg' '-Setup.exe' '-Portable.zip'; do
              compgen -G "$RUNNER_TEMP/release/$dir/*$kind" > /dev/null || { echo "::error::$tag has no $dir *$kind"; exit 1; }
            done
          done
          ls -l "$RUNNER_TEMP"/release/*
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sbom-*-${{ env.APP_VERSION }}
          path: ${{ runner.temp }}/sbom
          merge-multiple: true
      - name: Attest the packages' build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*/*
      - name: Attest the x64 packages' SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/win-x64/*
          sbom-path: ${{ runner.temp }}/sbom/agent-bridge-windows-win-x64-${{ env.APP_VERSION }}.cdx.json
      - name: Attest the Arm64 packages' SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/win-arm64/*
          sbom-path: ${{ runner.temp }}/sbom/agent-bridge-windows-win-arm64-${{ env.APP_VERSION }}.cdx.json

  spikes-linux:
    # The spikes' Linux checks, on one runner since both install the same Playwright browsers
    # (they were two jobs, s2-noise-interop and s4-relay, until #459):
    #  - S2: the .NET and WebCrypto Noise implementations must keep agreeing byte for byte, in
    #    Node, Chromium and WebKit (Safari's engine), and live over a WebSocket;
    #  - S4: the relay's security and routing checks against a fake GitHub, then the PWA in
    #    Chromium and WebKit through the same relay, then the container build.
    needs: plan
    if: needs.plan.outputs.whole-ring == 'true' || needs.plan.outputs.spikes-linux == 'true'
    runs-on: ubuntu-24.04
    # 35, as every job that runs `playwright install --with-deps` gets (#689): room for the five
    # minutes the download step gives a slow apt mirror and a full download from Canonical's
    # archive, on top of the checks.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: S2 builds and checks its vectors
        working-directory: spikes/s2-noise-interop
        run: |
          dotnet build dotnet/S2.Noise.csproj -c Release --nologo
          dotnet dotnet/bin/Release/net10.0/s2-noise.dll check
      - name: S2 fresh vectors from .NET, replayed in Node
        working-directory: spikes/s2-noise-interop
        run: |
          dotnet dotnet/bin/Release/net10.0/s2-noise.dll vectors "$RUNNER_TEMP/vectors.json"
          cp "$RUNNER_TEMP/vectors.json" web/vectors.json
          node js/test-node.mjs
      - name: S4 builds and checks the relay against a fake GitHub
        working-directory: spikes/s4-relay
        run: |
          dotnet build src/S4.DevStack -c Release --nologo
          dotnet build src/S4.Host -c Release --nologo
          dotnet src/S4.DevStack/bin/Release/net10.0/s4-devstack.dll check
          node js/test-sw.mjs
      - name: npm ci, for both
        run: |
          npm ci --prefix spikes/s2-noise-interop
          npm ci --prefix spikes/s4-relay
      - name: Which Playwright
        id: playwright
        working-directory: spikes/s4-relay
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      # Playwright's browsers come from a cache only main writes, keyed by the Playwright version
      # npm ci installed (#459). The install below still runs every time: it fetches the browsers
      # on a miss and installs their system packages either way.
      - name: Playwright's browsers from main's cache
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-webkit
      # Their system packages first, so a slow apt mirror can be left (as in pwa-ui; the action's
      # download.sh says why). The second spike's finds them downloaded while the two agree.
      - name: Download Playwright's system packages, S2
        uses: ./.github/actions/playwright-system-packages
        with:
          browsers: chromium webkit
          working-directory: spikes/s2-noise-interop
      - name: Download Playwright's system packages, S4
        uses: ./.github/actions/playwright-system-packages
        with:
          browsers: chromium webkit
          working-directory: spikes/s4-relay
      # In each spike, so a spike that moves to another Playwright still gets its own browsers;
      # the second is quick while they agree.
      - name: Playwright's browsers, for both
        run: |
          (cd spikes/s2-noise-interop && npx playwright install --with-deps chromium webkit)
          (cd spikes/s4-relay && npx playwright install --with-deps chromium webkit)
      - name: Save Playwright's browsers to main's cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}
      - name: S2 in Chromium and WebKit
        working-directory: spikes/s2-noise-interop
        run: node js/test-browsers.mjs
      - name: S4 the PWA through the relay
        working-directory: spikes/s4-relay
        run: node js/test-pwa.mjs
      - name: S4 container builds
        working-directory: spikes
        run: docker build -f s4-relay/Dockerfile -t agent-bridge-relay-s4 .

  light:
    # The small Linux checks, on one runner instead of one each (#459): each step runs when its
    # suite is selected, and every selected one runs even after another fails. When the whole
    # ring runs, every step runs, whatever the plan selected (#487).
    #  - design-gen, a11y-contrast: every client's generated copy matches design/, so a token or
    #    SVG changed without regenerating fails here, and every theme meets the contrast rules in
    #    design/tokens.json (design/README.md);
    #  - lab-nightly: the held nightly lab run's gate and cut verdict, offline (lab-nightly.yml);
    #  - pwa-unit: the PWA's unit tests in Node, then again for coverage, beside the Playwright
    #    jobs rather than before them (#457);
    #  - pwa-site-csp: the Pages build's CSP;
    #  - lab-scripts: the clean-VM lab's provisioning and runner-interface drafts, offline;
    #  - post-receipt-script: the receipts App's posting script, refusals and a dry run, offline;
    #  - red-minutes-script: the red-minutes figure's spell counting, offline (quality/red-minutes.ps1);
    #  - rerun-known-flakes: the automatic re-run of a known flake on main, refusals included, offline;
    #  - forms-soak-scripts: the forms soak rig's redaction checks and a syntax check of its stub
    #    server, offline (tools/lab/forms-soak);
    #  - playwright-apt: the download of Playwright's system packages leaves a slow apt mirror only
    #    when it should (.github/actions/playwright-system-packages);
    #  - lab-release-verify: the held lab release verification's gate, verdict and workflow shape,
    #    offline (lab-release-verify.yml);
    #  - docs-links: relative links and their #anchors in every Markdown file resolve.
    # Not in plan's own runner: a failing check there would skip every job that needs the plan.
    needs: plan
    if: needs.plan.outputs.whole-ring == 'true' || needs.plan.outputs.light == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUITES: ${{ needs.plan.outputs.suites }}
      WHOLE_RING: ${{ needs.plan.outputs.whole-ring }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Every generated file matches design/
        if: ${{ !cancelled() && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'design-gen') || contains(fromJSON(env.SUITES), 'a11y-contrast')) }}
        run: node tools/design-gen/generate.mjs --check
      - name: Contrast, the SVG subset and the generated files
        if: ${{ !cancelled() && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'design-gen') || contains(fromJSON(env.SUITES), 'a11y-contrast')) }}
        run: node --test "tools/design-gen/test/*.test.mjs"
      - name: Connector read-contract mock
        if: ${{ !cancelled() && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'connector-conformance')) }}
        run: node --test tools/connector-conformance/mock-host.test.mjs
      - name: The lab drafts plan only and refuse execution
        # Against a stand-in for az: nothing reaches Azure.
        if: ${{ !cancelled() && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'lab-scripts')) }}
        shell: pwsh
        run: pwsh -NoProfile -File quality/lab/test-scripts.ps1
      - name: The receipts App's posting script refuses bad input and signs offline
        # A throwaway key and a dry run: nothing reaches GitHub.
        if: ${{ !cancelled() && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'post-receipt-script')) }}
        shell: pwsh
        run: pwsh -NoProfile -File quality/test-post-receipt.ps1
      - name: The red-minutes figure counts spells the way the guardian does
        # A fixed run list: nothing reaches GitHub.
        if: ${{ !cancelled() && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'red-minutes-script')) }}
        shell: pwsh
        run: pwsh -NoProfile -File quality/test-red-minutes.ps1
      - name: Known-flake re-runs refuse real failures
        # Against a stand-in for gh: nothing reaches GitHub.
        if: ${{ !cancelled() && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'rerun-known-flakes')) }}
        shell: pwsh
        run: pwsh -NoProfile -File quality/test-rerun-known-flakes.ps1
      - name: The forms soak rig's redaction masks every secret shape
        # Offline: no CLI, console, token or model.
        if: ${{ !cancelled() && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'forms-soak-scripts')) }}
        shell: pwsh
        run: pwsh -NoProfile -File tools/lab/forms-soak/Test-Redaction.ps1
      - name: The forms soak rig's stub server parses
        if: ${{ !cancelled() && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'forms-soak-scripts')) }}
        run: node --check tools/lab/forms-soak/stub-mcp.js
      - name: Beta download metadata accepts only complete published pre-releases
        if: ${{ !cancelled() && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'beta-release-manifest')) }}
        shell: pwsh
        run: pwsh -NoProfile -File build/test-release-manifest.ps1
      - name: The MCP server's packages
        if: ${{ !cancelled() && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'mcp-server')) }}
        working-directory: mcp
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: MCP server tests
        if: ${{ !cancelled() && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'mcp-server')) }}
        run: node --test "mcp/test/*.test.mjs"
      - name: Playwright's system packages leave a slow apt mirror only for Canonical's archive
        if: ${{ !cancelled() && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'playwright-apt')) }}
        run: bash .github/actions/playwright-system-packages/test.sh
      - name: The lab release verification's gate refuses every run today, and its verdict passes only the release asked for
        # Offline: nothing reaches Azure or GitHub.
        if: ${{ !cancelled() && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'lab-release-verify')) }}
        shell: pwsh
        run: pwsh -NoProfile -File quality/lab/test-release-verify.ps1
      - name: Epic dashboard renders safely from offline fixtures
        if: ${{ !cancelled() && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'epic-dashboard-unit')) }}
        run: python3 -m unittest discover -s tools/epic-dashboard -v
      # build-site.mjs bundles the app with esbuild (#609), and the unit tests build the site: the
      # PWA's packages, as locked, without Playwright's browsers (only the pwa-ui jobs fetch those).
      # Without install scripts, as pages.yml builds the published site (#650), so a build that
      # needed one fails here first.
      - name: The PWA's packages
        if: ${{ !cancelled() && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'pwa-unit') || contains(fromJSON(env.SUITES), 'pwa-site-csp')) }}
        working-directory: pwa
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: PWA unit tests
        id: pwa-unit
        if: ${{ !cancelled() && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'pwa-unit')) }}
        working-directory: pwa
        run: node --test "test/unit/*.test.mjs"
      - name: PWA unit test coverage
        if: ${{ !cancelled() && steps.pwa-unit.outcome == 'success' }}
        working-directory: pwa
        # A second run, since V8's precise coverage makes code several times slower: markdown's
        # 1.5 s budget for pathological input took 2.0 s covered on the runner (0.7 s plain, 2.3 s
        # covered, on a dev box), so that one timing check is left to the run above, which counts.
        # This run only measures: a test failing here is reported and does not fail the job.
        continue-on-error: true
        shell: bash
        run: |
          out="$RUNNER_TEMP/pwa-coverage"
          mkdir -p "$out"
          rc=0
          node --test --experimental-test-coverage --test-coverage-exclude='test/**' \
            --test-skip-pattern='^pathological input finishes quickly$' \
            --test-reporter=spec --test-reporter-destination="$out/unit.log" \
            --test-reporter=lcov --test-reporter-destination="$out/lcov.info" \
            "test/unit/*.test.mjs" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::The PWA coverage run exited with $rc (1 is a failed test; see unit.log in the pwa-coverage artifact). The run without coverage passed."
          fi
          if [ ! -s "$out/lcov.info" ]; then
            echo "::warning::The PWA coverage run wrote no lcov.info."
            exit 0
          fi
          sed -n '/start of coverage report/,/end of coverage report/p' "$out/unit.log" 2>/dev/null || true
          awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} /^BRF:/{bf+=$2} /^BRH:/{bh+=$2} /^FNF:/{ff+=$2} /^FNH:/{fh+=$2}
            function pct(hit, found) { return found ? sprintf("%.1f (%d / %d)", 100*hit/found, hit, found) : "n/a" }
            END {
              print "## PWA unit test coverage\n\n| Lines % | Branches % | Functions % |\n|---:|---:|---:|"
              print "| " pct(lh, lf) " | " pct(bh, bf) " | " pct(fh, ff) " |"
            }' "$out/lcov.info" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && steps.pwa-unit.outcome != 'skipped' }}
        with:
          name: pwa-coverage
          path: ${{ runner.temp }}/pwa-coverage
          if-no-files-found: ignore
          retention-days: 14
      - name: The Pages build accepts the live relay and its blob store, and refuses bad ones
        if: ${{ !cancelled() && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'pwa-site-csp')) }}
        working-directory: pwa
        run: |
          node tools/build-site.mjs --out "$RUNNER_TEMP/site" --relay https://relay.example
          grep -q "connect-src 'self' https://relay.example wss://relay.example;" "$RUNNER_TEMP/site/index.html"
          # The page runs the bundle, so the relay must be in it, not only in config.js.
          grep -rqF 'https://relay.example' "$RUNNER_TEMP"/site/bundle/main-*.js
          # Each refusal is an explicit if: bash -e ignores a command negated with `!`, so this step
          # used to pass even when the build accepted the bad relay (#360). And it must refuse for
          # that reason: a build that crashed on something else would have passed just the same.
          if node tools/build-site.mjs --out "$RUNNER_TEMP/bad" --relay "https://relay.example/'; script-src *" 2> "$RUNNER_TEMP/bad.err"; then
            echo "::error::build-site.mjs accepted a relay that breaks out of the CSP"; exit 1
          fi
          grep -q -- '--relay must be an origin' "$RUNNER_TEMP/bad.err" || { cat "$RUNNER_TEMP/bad.err"; echo "::error::build-site.mjs failed, but not by refusing the relay"; exit 1; }
          node tools/build-site.mjs --out "$RUNNER_TEMP/site-blobs" --relay https://relay.example --blob-origin https://abblobs.blob.core.windows.net
          grep -q "connect-src 'self' https://relay.example wss://relay.example https://abblobs.blob.core.windows.net;" "$RUNNER_TEMP/site-blobs/index.html"
          if node tools/build-site.mjs --out "$RUNNER_TEMP/bad-blobs" --relay https://relay.example --blob-origin https://evil.example 2> "$RUNNER_TEMP/bad-blobs.err"; then
            echo "::error::build-site.mjs accepted a blob origin that is not an Azure blob store"; exit 1
          fi
          grep -q -- '--blob-origin must be an origin' "$RUNNER_TEMP/bad-blobs.err" || { cat "$RUNNER_TEMP/bad-blobs.err"; echo "::error::build-site.mjs failed, but not by refusing the blob origin"; exit 1; }
      - name: The lab nightly's gate refuses every run today, and its verdict passes only a cut both roles pass
        # Offline: nothing reaches Azure or GitHub.
        if: ${{ !cancelled() && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'lab-nightly')) }}
        shell: pwsh
        run: pwsh -NoProfile -File quality/lab/test-nightly.ps1
      # Relative links and their anchors (quality/catalog.yml, docs-links), so renaming a doc or a
      # heading can't strand the links to it. Offline: web links are not fetched, so a site being
      # down never fails a run. Advisory for now: a broken link is a warning on the run. lychee is
      # fetched by release and checked against its SHA-256 here, rather than through
      # lychee-action, which downloads it by tag alone (#487): a release asset swapped under the
      # same tag fails this step instead of running. To update, take the new release's
      # lychee-x86_64-unknown-linux-gnu.tar.gz.sha256. It comes through `gh release download` (the
      # API) first, as install-trivy's Trivy does: the release's web URL has failed part way
      # (curl exit 56) and returned HTTP 504 while the API still served the asset.
      - name: Links and anchors in Markdown resolve
        if: ${{ !cancelled() && (env.WHOLE_RING == 'true' || contains(fromJSON(env.SUITES), 'docs-links')) }}
        env:
          LYCHEE_VERSION: v0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=lychee-x86_64-unknown-linux-gnu
          file="$RUNNER_TEMP/$asset.tar.gz"
          # gh a few times, then the web URL. Either way the pinned hash below decides; a mismatch
          # is a failure, not a cue to retry, and a failed web download fails the step.
          downloaded=false
          for attempt in 1 2 3; do
            # Never let an earlier or partial file pass as this attempt's download.
            rm -f "$file"
            if gh release download "lychee-$LYCHEE_VERSION" --repo lycheeverse/lychee --pattern "$asset.tar.gz" --dir "$RUNNER_TEMP" --clobber && [ -f "$file" ]; then
              downloaded=true; break
            fi
            echo "::warning title=docs-links::gh release download of $asset.tar.gz failed (attempt $attempt of 3)"
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          if [ "$downloaded" != true ]; then
            echo "::warning title=docs-links::falling back to the release's web URL for $asset.tar.gz"
            rm -f "$file"
            curl -fsSL --retry 3 -o "$file" "https://github.com/lycheeverse/lychee/releases/download/lychee-$LYCHEE_VERSION/$asset.tar.gz"
          fi
          echo "$LYCHEE_SHA256  $file" | sha256sum --check --strict -
          tar -xzf "$file" -C "$RUNNER_TEMP"
          rc=0
          "$RUNNER_TEMP/$asset/lychee" --offline --include-fragments --no-progress --format markdown --output "$RUNNER_TEMP/lychee.md" '**/*.md' || rc=$?
          cat "$RUNNER_TEMP/lychee.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=docs-links::lychee found broken links or anchors (exit $rc); the job summary lists them."
          fi

  pwa-ui:
    # The product PWA in Chromium and WebKit against the published build (with its CSP), in demo
    # mode. Split over runners (#457): one run of every spec took 11 to 16 minutes on one, and set
    # the wall time of every PWA change. WebKit takes about twice Chromium's time, so it has three
    # shards. Playwright's --shard splits what --project selects, so together the four run every
    # spec in both browsers. --fully-parallel lets a shard split by test rather than by file: by
    # file, the first WebKit shard got axe, delegates and answer, and ran 5 minutes to the others'
    # 2 (no spec shares state between its tests; each has its own page). Two workers, as before: a
    # third made WebKit slower on these 4-CPU runners, not faster. test/e2e is pwa-e2e's
    # (PWA_SKIP_E2E): left out here, not left to skip itself for want of the dev stack.
    name: pwa-ui (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.whole-ring == 'true' || needs.plan.outputs.pwa-ui == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium
            project: chromium
            shard: 1/1
          - name: webkit 1/3
            project: webkit
            shard: 1/3
          - name: webkit 2/3
            project: webkit
            shard: 2/3
          - name: webkit 3/3
            project: webkit
            shard: 3/3
    runs-on: ubuntu-24.04
    # 35 minutes for every leg, as for every job that runs `playwright install --with-deps`
    # (#689). WebKit needs 181 system packages (114 MB), and on main run 41927187905 a slow apt
    # mirror held webkit 3/3 in that download past 20 minutes, twice, before a test ran; Chromium's
    # come from the same mirror. 35 leaves room for the five minutes the download step below gives
    # that mirror, a full download from Canonical's archive and the shard's tests. It bounds a
    # stuck job, not a test: a leg that passes takes as long as before.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: pwa
    env:
      PWA_SKIP_E2E: '1'
      PROJECT: ${{ matrix.project }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      - name: Which Playwright
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      # Playwright's browser from main's cache, as in spikes-linux, keyed by browser so each leg
      # restores only the one it runs.
      - name: Playwright's browsers from main's cache
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ matrix.project }}
      # Playwright's system packages, downloaded before its install so a slow apt mirror can be
      # left after five minutes for Canonical's HTTPS archive (#799; the action's download.sh says
      # how). The install below then finds them all downloaded; it, and the packages, are as before.
      # force-apt-fallback (workflow_dispatch, a branch only; quality/README.md §4.7) skips the five
      # minutes and takes that fallback before any package is downloaded, to prove it once; the
      # WebKit legs are the proof, so one that downloads nothing from Canonical fails. It is
      # false on every push and pull request run, which run the action exactly as before.
      - name: Download Playwright's system packages
        uses: ./.github/actions/playwright-system-packages
        with:
          browsers: ${{ matrix.project }}
          working-directory: pwa
          force-apt-fallback: ${{ github.event_name == 'workflow_dispatch' && inputs.force-apt-fallback }}
      - run: npx playwright install --with-deps "$PROJECT"
      - name: Save Playwright's browsers to main's cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}
      - run: npx playwright test --project="$PROJECT" --shard="$SHARD" --fully-parallel
      # Renders of the demo for design review (pwa/test/renders): captures, not checks, so they
      # never fail the job, and they are kept whatever the tests did. Design signs a state off
      # against what the product draws, and nothing runs on an owner's machine, so CI draws them.
      # Chromium alone: the engine that emulates forced colours.
      - name: Renders of the demo
        if: ${{ !cancelled() && matrix.project == 'chromium' && hashFiles('pwa/test/renders/*.render.mjs') != '' }}
        continue-on-error: true
        run: npx playwright test --config playwright.renders.config.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && matrix.project == 'chromium' }}
        with:
          name: pwa-renders
          path: pwa/renders/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: pwa-test-results-${{ matrix.project }}-${{ strategy.job-index }}
          path: pwa/test-results
          retention-days: 7
      # The sign-in captures test/sign-in.spec.mjs takes in Chromium (#800, #963), for Creative to
      # look at on every run, not only a failed one.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && matrix.project == 'chromium' }}
        with:
          name: pwa-captures
          path: |
            pwa/test-results/**/signin-*.png
            !pwa/test-results/**/attachments/**
          if-no-files-found: warn
          retention-days: 7

  pwa-e2e:
    # The PWA end to end through the spike dev stack's relay, in Chromium and WebKit
    # (test/e2e/e2e.spec.mjs). The only job that needs the dev stack, so the only one that builds
    # it (#457): built once, here, rather than in every shard or passed round as an artifact.
    needs: plan
    if: needs.plan.outputs.whole-ring == 'true' || needs.plan.outputs.pwa-e2e == 'true'
    runs-on: ubuntu-24.04
    # 35, as every job that runs `playwright install --with-deps` gets (#689): main run
    # 41952998347 cancelled this job at its old 15 inside that install, fetching 126 of Chromium's
    # and WebKit's packages from azure.archive.ubuntu.com at about 100 kB/s. Room for the download
    # step's five minutes on that mirror and a full download from Canonical's archive.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build the dev stack
        # The specs skip themselves without it, and pass, so its absence must fail here instead.
        run: |
          dotnet build ../spikes/s4-relay/src/S4.DevStack -c Release --nologo
          test -f ../spikes/s4-relay/src/S4.DevStack/bin/Release/net10.0/s4-devstack.dll || { echo "::error::the dev stack built no s4-devstack.dll, so the e2e specs would skip"; exit 1; }
      - run: npm ci
      - name: Which Playwright
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Playwright's browsers from main's cache
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-webkit
      # As in pwa-ui: the system packages first, so a slow apt mirror can be left.
      - name: Download Playwright's system packages
        uses: ./.github/actions/playwright-system-packages
        with:
          browsers: chromium webkit
          working-directory: pwa
      - run: npx playwright install --with-deps chromium webkit
      - name: Save Playwright's browsers to main's cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}
      - run: npx playwright test test/e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: pwa-test-results-e2e
          path: pwa/test-results
          retention-days: 7
      # The sign-in link's capture (test/e2e/e2e.spec.mjs, #969), for Creative on every run.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: pwa-captures-e2e
          path: |
            pwa/test-results/**/signin-*.png
            !pwa/test-results/**/attachments/**
          if-no-files-found: warn
          retention-days: 7

  quality-gate:
    # The one check that sums up this workflow (quality/README.md §4.7), and the one to make
    # required. Every job the plan marked to run must have succeeded: when the whole ring runs,
    # that is every job here; otherwise, on main as on a pull request, those the plan gave true. A
    # job the plan skipped isn't selected, so no run waits on it, but any job that failed or was
    # cancelled fails this, and so does a selected job that was skipped (#487). The plan itself is
    # in needs, since when it fails every other job is skipped. The catalog check fails when any
    # check job is missing here. publish-gate, sign, publish, attest and relay-image-sarif are
    # not: they deliver rather than check, and run only on main.
    # A draft's gate has another name, so the required check, quality-gate, only ever comes from
    # ring 1 or 2. Ready for review reruns this workflow on the same head, and GitHub creates the
    # new gate's check only once every job it needs is done; under the same name, the draft's
    # green gate would stand for the whole head until then, and a merge could go through on it.
    name: ${{ github.event.pull_request.draft && 'quality-gate (fast ring)' || 'quality-gate' }}
    needs: [plan, product, ha-integration, spikes, spikes-linux, app, app-installer, light, pwa-ui, pwa-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # Whether this run built and checked the app's packages: publish-gate publishes only then.
      app: ${{ needs.app.result }}
    steps:
      - name: Every job the plan selected passed, and none failed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error title=quality-gate::failed or cancelled: $bad"
            exit 1
          fi
          # A plan that passed gives whole-ring and every job here exactly true or false. Anything
          # else, an output renamed or lost, would leave a job unselected without a word, and main
          # no longer runs every job regardless.
          unknown=$(echo "$NEEDS" | jq -r '
            (.plan.outputs // {}) as $plan
            | if .plan.result != "success" then "" else
                [("whole-ring", (keys[] | select(. != "plan")))
                  | select(($plan[.] // "") as $v | $v != "true" and $v != "false")]
                | join(", ") end')
          if [ -n "$unknown" ]; then
            echo "::error title=quality-gate::the plan gave no true or false for: $unknown"
            exit 1
          fi
          # Selected: every job when the whole ring runs, otherwise those the plan gave true. On a
          # pull request the app is the exception: its output says whether the change needs it,
          # whole ring or not (#1249). Each must have succeeded; a skipped one was meant to run
          # and didn't.
          missing=$(echo "$NEEDS" | jq -r --arg ev "$EVENT" '
            (.plan.outputs // {}) as $plan
            | ($plan["whole-ring"] == "true") as $all
            | [to_entries[] | select(.key == "plan" or ($all and (.key != "app" or $ev != "pull_request")) or $plan[.key] == "true")
                | select(.value.result != "success") | "\(.key) (\(.value.result))"]
            | join(", ")')
          if [ -n "$missing" ]; then
            echo "::error title=quality-gate::selected but did not succeed: $missing"
            exit 1
          fi
      # A green draft is a green fast ring, not a green PR gate; its check is named apart (above).
      - name: A draft's result is partial
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          msg="Draft: only the fast ring ran (ring 0 on Linux, in-process tests). Ready for review runs ring 1, everything it selects."
          echo "::notice title=quality-gate (partial)::$msg"
          echo "### quality-gate: partial. $msg" >> "$GITHUB_STEP_SUMMARY"
