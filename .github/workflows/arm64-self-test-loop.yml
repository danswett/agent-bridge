name: ARM64 self-test loop (non-gating)

# Manual diagnostic samples for the history and wheel flakes (#2535, #2483, #2508).
# There is no group/case filter: each loop runs the whole self-test, from one publish.
# This reports failures honestly; it is not CI, a required check or merge evidence.
# Quality dispatches this after landing, with the exact source SHA to investigate.
on:
  workflow_dispatch:
    inputs:
      head-sha:
        description: Full 40-character source commit SHA to build and test
        type: string
        required: true
      loops:
        description: Requested samples (1 to 30); the time budget may stop earlier
        type: number
        default: 10
        required: true

permissions:
  contents: read

concurrency:
  group: arm64-self-test-loop
  cancel-in-progress: false

env:
  APP_VERSION: 0.1.${{ github.run_number }}
  APP_RELEASE: 'false'
  APP_SIGNING: 'false'

jobs:
  loop:
    name: ARM64 diagnostic samples (non-gating)
    runs-on: windows-11-arm
    timeout-minutes: 345
    defaults:
      run:
        shell: pwsh
    env:
      HEAD_SHA: ${{ inputs.head-sha }}
      LOOPS: ${{ inputs.loops }}
    steps:
      - name: Validate inputs
        run: |
          if ($env:HEAD_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw 'head-sha must be a full lowercase 40-character commit SHA'
          }
          $count = 0
          if ($env:LOOPS -notmatch '^[0-9]+$' -or
              -not [int]::TryParse($env:LOOPS, [ref]$count) -or $count -lt 1 -or $count -gt 30) {
            throw 'loops must be an integer from 1 to 30'
          }
          "LOOP_JOB_STARTED=$([DateTimeOffset]::UtcNow.ToString('o'))" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head-sha }}
          persist-credentials: false
      - name: Record the exact source
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:HEAD_SHA) {
            throw 'checkout does not match the requested source SHA'
          }
          $dir = Join-Path $env:RUNNER_TEMP 'arm64-loop'
          New-Item -ItemType Directory -Force $dir | Out-Null
          "source: $actual`nrequested loops: $env:LOOPS`nstarted: $env:LOOP_JOB_STARTED" |
            Set-Content (Join-Path $dir 'source.txt')
      - uses: ./.github/actions/arm64-foreground
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool install -g vpk --version 1.2.161
      - name: Publish and pack once
        # Same dev app build as CI; no release-feed reads, signing or publishing.
        run: ./build/pack-app.ps1 -Version $env:APP_VERSION -Runtime win-arm64 -Out out/app-arm64 -Release:($env:APP_RELEASE -eq 'true')
      - name: Repeat the self-test
        run: |
          # A failed child must not stop subsequent samples under Actions' Stop preference.
          $PSNativeCommandUseErrorActionPreference = $false
          $root = Join-Path $env:RUNNER_TEMP 'arm64-loop'
          New-Item -ItemType Directory -Force $root | Out-Null
          $started = [DateTimeOffset]::Parse($env:LOOP_JOB_STARTED)
          $requested = [int]$env:LOOPS
          $completed = 0
          $passed = 0
          $failed = 0
          for ($i = 1; $i -le $requested; $i++) {
            # Leave time for the last sample's diagnostics and the artifact upload.
            if (([DateTimeOffset]::UtcNow - $started).TotalMinutes -ge 300) {
              Write-Output 'Time budget reached; no further loop will start.'
              break
            }
            $dir = Join-Path $root ('run-{0:D2}' -f $i)
            New-Item -ItemType Directory -Force $dir | Out-Null
            $result = Join-Path $dir 'result.json'
            & pwsh -NoProfile -File ./build/app-self-test.ps1 -Exe out/app-arm64/publish/AgentBridge.exe -Result $result -TimeoutSeconds 720 *> (Join-Path $dir 'self-test.log')
            $code = $LASTEXITCODE
            $problems = [Collections.Generic.List[string]]::new()
            if ($code -ne 0) { $problems.Add("exit code $code") }
            if (Test-Path -LiteralPath $result) {
              try {
                $report = Get-Content -LiteralPath $result -Raw | ConvertFrom-Json -AsHashtable
                if ($report -isnot [Collections.IDictionary] -or
                    -not $report.Contains('failed') -or $report.failed -isnot [array] -or
                    -not $report.Contains('unfinished') -or
                    ($null -ne $report.unfinished -and $report.unfinished -isnot [string])) {
                  throw 'expected failed array and unfinished string or null'
                }
                foreach ($case in $report.failed) { $problems.Add([string]$case) }
                if ($report.unfinished) { $problems.Add("unfinished: $($report.unfinished)") }
              }
              catch { $problems.Add("invalid result.json: $($_.Exception.Message)") }
            }
            else { $problems.Add('missing result.json') }
            $completed++
            if ($problems.Count -eq 0) {
              $passed++
              $line = "Loop $i/$requested`: PASS; all self-test cases"
            }
            else {
              $failed++
              $line = "Loop $i/$requested`: FAIL; $($problems -join '; ')"
            }
            "source: $env:HEAD_SHA`nexit code: $code`n$line" |
              Set-Content (Join-Path $dir 'receipt.txt')
            Write-Output $line
            $line >> $env:GITHUB_STEP_SUMMARY
          }
          $early = if ($completed -lt $requested) { 'yes' } else { 'no' }
          $summary = "completed $completed of $requested requested loops, $passed passed, $failed failed, stopped early: $early"
          $summary | Set-Content (Join-Path $root 'summary.txt')
          Write-Output $summary
          $summary >> $env:GITHUB_STEP_SUMMARY
          if ($failed -gt 0 -or $completed -lt $requested) { exit 1 }
      - name: Keep every loop's logs and receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arm64-self-test-loops-${{ inputs.head-sha }}
          path: ${{ runner.temp }}/arm64-loop
          if-no-files-found: error
          retention-days: 14
