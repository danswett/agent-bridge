name: HA contract drift

# The HA connector speaks agent-ha-bridge's per-machine Home Assistant contract exactly, checked
# against fixtures recorded from agent-ha-bridge's own functions at one pinned commit
# (docs/ha-connector.md, "Keeping up with agent-ha-bridge"). agent-ha-bridge keeps shipping, so
# once a day this records the contract again from its main and, when it has moved, says so on
# one issue labelled `parity` and fails, rather than letting the connector drift out of step.
#
# Read-only against agent-ha-bridge: a shallow checkout with no credentials kept, read by the
# exporter's syntax-tree loader and `git rev-parse`/`status`. Nothing is ever pushed anywhere,
# and the committed fixtures are never touched (everything is recorded under RUNNER_TEMP).

on:
  schedule:
    # 14:23 UTC: early morning Pacific, off the hour.
    - cron: '23 14 * * *'
  workflow_dispatch:
  # A change to the guard or the fixtures is checked against the commit the fixtures are pinned
  # at, not main: that proves the committed fixtures are exactly what the exporter records there,
  # and exercises the guard itself, without opening issues about upstream moving meanwhile.
  pull_request:
    branches: [main]
    paths:
      - tools/ha-contract/**
      - tests/AgentBridge.HomeAssistant.Tests/Fixtures/**
      - .github/workflows/ha-contract-drift.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: ha-contract-drift-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  drift:
    # Windows, where the exporter is developed and run by hand.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Which agent-ha-bridge commit
        id: ref
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            $fixture = Get-Content tests/AgentBridge.HomeAssistant.Tests/Fixtures/ha-contract.json -Raw | ConvertFrom-Json
            "ref=$($fixture.source.commit)" >> $env:GITHUB_OUTPUT
          } else { "ref=main" >> $env:GITHUB_OUTPUT }
      - name: agent-ha-bridge (read-only)
        uses: actions/checkout@v4
        with:
          repository: danswett/agent-ha-bridge
          ref: ${{ steps.ref.outputs.ref }}
          path: agent-ha-bridge
          fetch-depth: 1
          persist-credentials: false
      - name: Record the contract and compare it with the fixtures
        id: drift
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/ha-contract/Test-HaContractDrift.ps1 -Source agent-ha-bridge -OutDir "$env:RUNNER_TEMP/ha-contract-drift"
          $code = $LASTEXITCODE
          "code=$code" >> $env:GITHUB_OUTPUT
          Get-Content "$env:RUNNER_TEMP/ha-contract-drift/summary.md" >> $env:GITHUB_STEP_SUMMARY
          exit 0
      - name: Keep what was recorded
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ha-contract-drift
          path: ${{ runner.temp }}/ha-contract-drift
          if-no-files-found: ignore
      - name: Open, update or close the parity issue
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          pwsh -NoProfile -File tools/ha-contract/Publish-HaContractDrift.ps1
          -Code ${{ steps.drift.outputs.code }}
          -OutDir "$env:RUNNER_TEMP/ha-contract-drift"
          -Repository "${{ github.repository }}"
          -RunUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Fail when the contract moved
        if: steps.drift.outputs.code != '0'
        shell: pwsh
        run: |
          Write-Host "::error::agent-ha-bridge ${{ steps.ref.outputs.ref }} does not match the fixtures (drift check exit ${{ steps.drift.outputs.code }}); see the run summary$(if ('${{ github.event_name }}' -ne 'pull_request') { ' and the parity issue' })."
          exit 1
