version: 2

# Every action in .github/workflows is pinned to a full commit SHA with its version in a comment
# (#360): a tag can be moved by whoever controls it, a SHA cannot. Dependabot keeps those pins,
# and their comments, current.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A new release waits a week before it is proposed, so a compromised one is likelier to be
    # caught and pulled first. Once proposed, it runs unreviewed in that PR's CI, with whatever
    # each job's `permissions:` grant, as for any branch in this repository. On a pull request
    # that is read-only apart from CodeQL's security-events: write (its results upload) and
    # relay.yml's id-token: write. relay.yml's Azure jobs therefore skip Dependabot, and a bumped
    # action reaches the staging OIDC sign-in only once a person has reviewed and merged it.
    cooldown:
      default-days: 7
    # One PR a week rather than one per action: each runs the whole CI.
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'CI'
