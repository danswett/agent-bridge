name: Install Trivy
description: >
  Puts a pinned, checksum-verified Trivy on PATH, on Linux x64 and Windows (x64, and Arm64 through
  x64 emulation), for the relay image's scan and SBOM and the Windows app's SBOMs
  (quality/README.md §3.3, "Supply chain").
inputs:
  vulnerability-db:
    description: >
      'true' to also download the vulnerability database into TRIVY_CACHE_DIR, from mirror.gcr.io or,
      failing that, ghcr.io (download-db.ps1 says why Trivy's own fallback is not enough), and fail
      if neither serves it. For vulnerability scans, which then run with --skip-db-update. SBOMs
      need no database.
    required: false
    default: 'false'

# The release archive, not aquasecurity/trivy-action or setup-trivy: in March 2026 an attacker
# force-pushed 76 of trivy-action's 77 tags and all of setup-trivy's to credential-stealing code,
# and published a malicious Trivy 0.69.4 (GHSA-69fq-xp46-6x23). Even a SHA-pinned trivy-action
# downloads Trivy by version; a hash pinned here cannot be moved. The hashes are from the release's
# trivy_<version>_checksums.txt, and each archive also passed
# `gh attestation verify <file> -R aquasecurity/trivy` (signed by Trivy's release workflow at the
# tag) when it was pinned. Bump the version and both hashes together, checking them the same way.
runs:
  using: composite
  steps:
    # Main's last verified archive and, for scans, its last database, so a GitHub release or
    # registry outage costs nothing once main has saved them. Only main writes either. The archive
    # is hash-checked below however it arrived; the database is used only when both registries fail.
    - id: archive
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/trivy-archive
        key: trivy-archive-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/action.yml', github.action_path)) }}
    - id: db-cache
      if: inputs.vulnerability-db == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/trivy-db-fallback
        key: trivy-db-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: trivy-db-${{ runner.os }}-
    - id: install
      shell: pwsh
      env:
        TRIVY_VERSION: 0.76.1
        TRIVY_LINUX_X64_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        TRIVY_WINDOWS_X64_SHA256: 1051f49cb22d5284f43425f72aad9cda63ca12ceb92e7caa06903490c82dc9bf
        VULNERABILITY_DB: ${{ inputs.vulnerability-db }}
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:RUNNER_OS -eq 'Linux' -and $env:RUNNER_ARCH -eq 'X64') {
          $asset = "trivy_${env:TRIVY_VERSION}_Linux-64bit.tar.gz"; $sha = $env:TRIVY_LINUX_X64_SHA256
        } elseif ($env:RUNNER_OS -eq 'Windows') {
          $asset = "trivy_${env:TRIVY_VERSION}_windows-64bit.zip"; $sha = $env:TRIVY_WINDOWS_X64_SHA256
        } else {
          throw "no Trivy is pinned for $env:RUNNER_OS $env:RUNNER_ARCH"
        }
        $dir = Join-Path $env:RUNNER_TEMP 'trivy'
        New-Item -ItemType Directory -Force $dir | Out-Null
        $file = Join-Path $env:RUNNER_TEMP $asset
        # The release's web URL has returned HTTP 504 while an authenticated `gh release download`,
        # through the API, still served the same asset. So gh first, a few times, then the web URL.
        # Either way the pinned hash below decides; a mismatch is a failure, not a cue to retry.
        $downloaded = $false
        $archiveDir = Join-Path $env:RUNNER_TEMP 'trivy-archive'
        $cached = Join-Path $archiveDir $asset
        if (Test-Path -LiteralPath $cached -PathType Leaf) {
          if ((Get-FileHash $cached -Algorithm SHA256).Hash.ToLowerInvariant() -eq $sha) {
            Copy-Item -LiteralPath $cached -Destination $file -Force
            $downloaded = $true
            Write-Host "Using main's cached $asset"
          } else {
            Remove-Item -LiteralPath $cached -Force
          }
        }
        if (-not $downloaded -and (Get-Command gh -CommandType Application -ErrorAction SilentlyContinue)) {
          # A failed attempt is the next one's cue, not a reason to stop.
          $PSNativeCommandUseErrorActionPreference = $false
          foreach ($attempt in 1..3) {
            # Never let an earlier or partial file pass as this attempt's download.
            Remove-Item -LiteralPath $file -Force -ErrorAction SilentlyContinue
            gh release download "v${env:TRIVY_VERSION}" --repo aquasecurity/trivy --pattern $asset --dir $env:RUNNER_TEMP --clobber
            $exit = $LASTEXITCODE
            if ($exit -eq 0 -and (Test-Path -LiteralPath $file -PathType Leaf)) { $downloaded = $true; break }
            Write-Warning "gh release download of $asset failed (attempt $attempt of 3, exit $exit)"
            if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
        } elseif (-not $downloaded) {
          Write-Warning 'gh is not on PATH'
        }
        if (-not $downloaded) {
          Write-Warning "Falling back to Invoke-WebRequest for $asset"
          Remove-Item -LiteralPath $file -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest "https://github.com/aquasecurity/trivy/releases/download/v${env:TRIVY_VERSION}/$asset" -OutFile $file -MaximumRetryCount 3 -RetryIntervalSec 5
          # gh's failure would otherwise be this step's exit code: Actions ends a pwsh step with
          # `exit $LASTEXITCODE`, and the Windows path runs no later native command to reset it.
          $global:LASTEXITCODE = 0
        }
        $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actual -ne $sha) { throw "$asset hashes to $actual, not the pinned $sha" }
        New-Item -ItemType Directory -Force $archiveDir | Out-Null
        Copy-Item -LiteralPath $file -Destination $cached -Force
        if ($asset.EndsWith('.zip')) {
          Expand-Archive $file -DestinationPath $dir -Force
        } else {
          tar -xzf $file -C $dir trivy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
        }
        Add-Content -Path $env:GITHUB_PATH -Value $dir
        # Its cache, vulnerability database included, in the runner's temp, emptied after each job.
        $cache = Join-Path $env:RUNNER_TEMP 'trivy-cache'
        Add-Content -Path $env:GITHUB_ENV -Value "TRIVY_CACHE_DIR=$cache"
        if ($env:VULNERABILITY_DB -eq 'true') {
          $env:PATH = "$dir$([IO.Path]::PathSeparator)$env:PATH"
          . (Join-Path $env:GITHUB_ACTION_PATH 'download-db.ps1')
          $fallback = Join-Path $env:RUNNER_TEMP 'trivy-db-fallback'
          try {
            Save-TrivyDb -CacheDir $cache
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'db-fresh=true'
          } catch {
            # Both registries failed: the database main last saved, if under two days old, beats no scan.
            $saved = Join-Path $fallback 'db'
            $meta = Join-Path $saved 'metadata.json'
            if ((Test-Path -LiteralPath (Join-Path $saved 'trivy.db')) -and (Test-Path -LiteralPath $meta) -and
                ((Get-Date) - (Get-Item -LiteralPath $meta).LastWriteTime).TotalHours -lt 48) {
              Write-Warning "$($_.Exception.Message); using main's cached vulnerability database"
              New-Item -ItemType Directory -Force (Join-Path $cache 'db') | Out-Null
              Copy-Item -Path (Join-Path $saved '*') -Destination (Join-Path $cache 'db') -Recurse -Force
              # Save-TrivyDb's failed native calls left their exit code, which would end this step.
              $global:LASTEXITCODE = 0
            } else {
              throw
            }
          }
        }
    - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.archive.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/trivy-archive
        key: ${{ steps.archive.outputs.cache-primary-key }}
    - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.install.outputs.db-fresh == 'true'
      shell: pwsh
      run: |
        $db = Join-Path $env:RUNNER_TEMP 'trivy-db-fallback'
        New-Item -ItemType Directory -Force $db | Out-Null
        Copy-Item -Path (Join-Path $env:TRIVY_CACHE_DIR 'db') -Destination $db -Recurse -Force
    - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.install.outputs.db-fresh == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/trivy-db-fallback
        key: trivy-db-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
