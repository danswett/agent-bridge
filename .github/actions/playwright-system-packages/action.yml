name: Playwright's system packages
description: >
  Downloads and offline-installs the system packages for the given browsers, with bounded
  network retries and Canonical mirror fallback (download.sh says why). With a non-forced
  debs cache hit, exhausted update network failures warn before the mandatory offline install.
  Jobs then run browser-only `playwright install`, without another apt update. Linux runners only.

inputs:
  browsers:
    description: The browsers, space-separated, as given to `playwright install --with-deps`.
    required: true
  working-directory:
    description: The folder whose node_modules holds that Playwright.
    required: true
  force-apt-fallback:
    description: >
      'true' only in ci.yml's pwa-ui legs on a run by hand that asks for it (quality/README.md
      §4.7): leave the Azure mirror before downloading anything, to prove the fallback once.
      Anything else downloads as before.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # Keep debs and their signed indexes together: the image's older indexes may select versions
    # absent from a newer debs cache. Each ref may seed its own pair after a successful cold run.
    - id: ubuntu
      shell: bash
      run: echo "version=$(lsb_release -rs)-${ImageVersion:-noimage}" >> "$GITHUB_OUTPUT"
    - id: debs
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/playwright-apt-debs
          ~/.cache/playwright-apt-lists
        key: playwright-apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.ubuntu.outputs.version }}-${{ inputs.browsers }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}-lists-v1
    - id: packages
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BROWSERS: ${{ inputs.browsers }}
        PLAYWRIGHT_APT_FORCE_FALLBACK: ${{ inputs.force-apt-fallback }}
        DEBS_CACHE_HIT: ${{ steps.debs.outputs.cache-hit }}
      run: |
        # A forced fallback proves the mirror switch, so it must really download.
        if [ "$PLAYWRIGHT_APT_FORCE_FALLBACK" != true ] && compgen -G "$HOME/.cache/playwright-apt-debs/*.deb" > /dev/null; then
          sudo cp -n "$HOME"/.cache/playwright-apt-debs/*.deb /var/cache/apt/archives/
        fi
        read -ra browsers <<< "$BROWSERS"
        bash "$GITHUB_ACTION_PATH/download.sh" "${browsers[@]}"
    - if: steps.packages.outputs.cache-ready == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/playwright-apt-debs
          ~/.cache/playwright-apt-lists
        key: ${{ steps.debs.outputs.cache-primary-key }}
