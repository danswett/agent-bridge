# Proposal #544, option A: a quasi-proportional sans from the monospace's own skeleton.
# NOT APPROVED. Proposal material only: nothing in design/, the tokens or the clients uses it.
#
# Built the way Iosevka Aile is built (spacing = "quasi-proportional", serifs = "sans"),
# from design/fonts/slipgates-mono/private-build-plans.toml: the same Iosevka 34.9.1,
# the same IoskeleyMono variants (tailed l, flag 1, straight 7, open 4/6/9, flat-top 3,
# square dots), the same metric overrides (x-height 520, cap 690, ascender 740).
# Four changes from the mono, each because a proportional text face needs it:
#   i, j and I are serifless: the mono's slab i and serifed I exist to fill a 600-unit
#   cell; in proportional text they make uneven rhythm, and the tailed l already keeps
#   l, I and 1 apart. The zero is unslashed: a dotted zero is a code convention and IDs
#   and hashes stay in the mono. Ligatures stay off.
# Width 540, not the mono's 600: in quasi-proportional spacing the width sets each letter's
# advance, and at 600 a line set 22% wider than Segoe UI Variable (540: 10%, close to Inter).
# Weights: every weight the type ramps use (400, 500, 600, 700), upright and italic.
# Build: build.sh beside this file (Iosevka has no variable-font target).

[buildPlans.SlipgatesSansA]
family = "Slipgates Sans A"
spacing = "quasi-proportional"
serifs = "sans"
noCvSs = true
noLigation = true
exportGlyphNames = false
