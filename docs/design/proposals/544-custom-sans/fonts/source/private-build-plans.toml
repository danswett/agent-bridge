[buildPlans.SlipgatesSansA.metricOverride]
xHeight = 520
cap = 690
ascender = 740
sb = 85

accentWidth = 182
accentClearance = 76
accentHeight = 162
accentStackOffset = 208

leading = 1250
parenSize = 860
dotSize = 'blend(weight, [100, 110], [400, 125], [900, 150])'
periodSize = 140

essRatio = 1.03
essRatioUpper = 1.03
essRatioLower = 1.03
essRatioQuestion = 1.03
archDepth = 152
smallArchDepth = 157

[buildPlans.SlipgatesSansA.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.SlipgatesSansA.weights.Medium]
shape = 500
menu = 500
css = 500

[buildPlans.SlipgatesSansA.weights.SemiBold]
shape = 600
menu = 600
css = 600

[buildPlans.SlipgatesSansA.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.SlipgatesSansA.widths.Normal]
shape = 540
menu = 5
css = "normal"

[buildPlans.SlipgatesSansA.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.SlipgatesSansA.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"
# Characters agent output actually uses. Everything else falls back to the platform font,
# which keeps each file small enough to ship in the apps and the PWA.
[buildPlans.SlipgatesSansA.subset.include]
ranges = [
  [32, 126],      # Basic Latin
  [160, 255],     # Latin-1 Supplement
  [256, 383],     # Latin Extended-A
  [384, 591],     # Latin Extended-B
  [688, 767],     # Spacing Modifier Letters (ʻ ʼ ˆ ˜): added for the text face
  [768, 879],     # Combining Diacritical Marks
  [7680, 7935],   # Latin Extended Additional (Vietnamese): added for the text face, which Segoe covers
  [880, 1023],    # Greek
  [1024, 1279],   # Cyrillic
  [8192, 8303],   # General Punctuation
  [8352, 8383],   # Currency Symbols
  [8448, 8527],   # Letterlike Symbols
  [8528, 8591],   # Number Forms
  [8592, 8703],   # Arrows
  [8704, 8959],   # Mathematical Operators
  [8960, 9215],   # Miscellaneous Technical (⌘ ⌥ ⏎ ⏻)
  [9472, 9599],   # Box Drawing
  [9600, 9631],   # Block Elements
  [9632, 9727],   # Geometric Shapes
  [9728, 9983],   # Miscellaneous Symbols
  [9984, 10175],  # Dingbats (✓ ✗)
  [10240, 10495], # Braille (CLI spinners)
]


