name: AgentBridgeApple
options:
  bundleIdPrefix: dev.agentbridge
settings:
  SWIFT_VERSION: 6.0
  IPHONEOS_DEPLOYMENT_TARGET: '18.0'
  MACOSX_DEPLOYMENT_TARGET: '15.0'
packages:
  AgentBridgeAppleCore:
    path: .
targets:
  AgentBridgeMac:
    type: application
    platform: macOS
    sources: [Apps, State]
    dependencies:
      - package: AgentBridgeAppleCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.agentbridge.mac
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Agent Bridge
  AgentBridgeMobile:
    type: application
    platform: iOS
    sources: [Apps, State]
    dependencies:
      - package: AgentBridgeAppleCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.agentbridge.mobile
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Agent Bridge
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
      INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to an Agent Bridge relay on your local network.
      TARGETED_DEVICE_FAMILY: '1,2'
