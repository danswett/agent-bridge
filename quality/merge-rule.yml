# The merge rule GitHub enforces (AGENTS.md, "Pull requests"; quality/README.md §4.9). The
# merge-rule workflow (.github/workflows/merge-rule.yml) reads this file from main, never from the
# pull request it judges, and posts the commit status `merge-rule` on each open pull request's
# head; main's ruleset (quality/ruleset-main.json) requires that status and `quality-gate`.
# A pull request that changes this file is itself security-sensitive (quality/** below), so the
# rule can only be loosened with an independent review on the exact head, and only takes effect
# once that change is on main.

# Only pull requests into this branch are judged; main's ruleset protects only it.
base: main

# Who posts merge-rule, as GraphQL names it (without REST's "[bot]"): the merge-rule GitHub App
# (docs/merge-rule-app.md, App ID 5607979), so the evaluator recognises its own earlier post and
# doesn't post the same verdict again. Main's ruleset accepts merge-rule only from this App.
status_poster: agent-bridge-merge-rule

# A review whose author is this bot, on the head commit, is the Copilot review. GraphQL names the
# bot without REST's "[bot]" suffix, and the evaluator also requires the author to be a Bot, so a
# user account with the same login can't stand in for it. Its body must show the review completed
# (MergeRule.CopilotReviewFailure): Copilot posts errors such as a billing failure, and reviews
# that didn't run in full, as reviews by the same bot on the same commit (#706); those fail the rule.
copilot_reviewer: copilot-pull-request-reviewer

# Any of these labels holds a pull request, whatever else it has.
hold_labels: [hold, do-not-merge]

# The independent review's receipt: a commit status with this context on the exact head, whose
# latest from one of these accounts is success (AGENTS.md says how to post it). A status binds to
# its commit, so any new push drops it. Statuses from anyone else, the workflows' own token above
# all, are ignored: a pull request's workflow can't post its own receipt.
independent_review:
  context: independent-review
  posters: [danswett]

# A pull request marked as a security change needs the receipt whatever it touches: a title
# starting with this word (any case), or one of these labels. #549, a fix to how approvals render,
# touched no path below and would otherwise have passed on Copilot's review alone.
security_marks:
  title_prefix: Security
  labels: [security]

# CodeQL (#452): the latest run on the head of the workflow with this name must have succeeded,
# and code scanning's check of that name (new alerts at GitHub's threshold) must not have failed.
# A required code_scanning rule can't do this: a pull request whose languages CodeQL skips (#464)
# uploads nothing, and the rule would wait for results forever.
codeql:
  workflow: CodeQL
  check: CodeQL

# Every check run and status on the head must pass too (success, skipped or neutral), not only
# quality-gate: CodeQL's jobs, Dependencies, Workflow lint, Relay deploy, Perf and the native
# clients sit outside it. A workflow counts by its latest run on the head. These workflows are
# left out: the merge rule's own, which are running while it judges.
ignore_workflows: [Merge rule]

# Main must be green. GitHub's auto-merge doesn't pause while main's CI is red, and would keep
# landing pull requests on a broken main, each making the breakage harder to untangle. So while
# this workflow's latest finished push run on main (at its latest attempt) isn't a success, every
# pull request fails; a newer run still going doesn't count, so main stays red until the fix's run
# passes. A pull request with one of these labels is the fix, and skips this check alone: every
# other requirement, the independent review included, still applies. Adding a label takes triage
# rights, so a pull request's author can't exempt their own from a fork: ask the merge coordinator.
main_green:
  workflow: ci.yml
  exempt_labels: [fixes-main]

# The standing rule (owner decision 2026-11-05, #955; it began as a stopgap when Copilot's review
# quota ran out at about 18:02 PT): Copilot reviews only the security PRs Quality spends the
# monthly included requests on. A pull request with one of these labels may go without a
# completed Copilot review on its head, but only with a success independent-review receipt on that
# head from one of independent_review.posters. One that needs that receipt (a sensitive path, a
# security mark, an incomplete file list) also needs a success second_review receipt on the same
# head from a poster, and the two descriptions must each name a model from a different family:
# Copilot caught #836's HIGH after two claude-opus-5.5 reviews missed it, and the second family is
# what stands in for that. Sensitive files under one_review_paths don't call for the second
# (Product, hub 6675322154: a status.md row the receipt checked against its decision). The label
# alone waives nothing, and every other requirement stands. Adding a label takes triage rights:
# the merge coordinator adds it.
copilot_waiver:
  labels: [copilot-waived]
  second_review: independent-review-2
  one_review_paths:
    - docs/status.md

# A pull request that changes any of these paths also needs the independent review. Globs as in
# quality/catalog.yml (src/**trust** is any path below src/ with "trust" in it, folders included),
# matched case-insensitively against each changed path and each renamed file's old path. The list
# follows AGENTS.md's rule 5: when in doubt, a path is on it. Not "key" alone, though: that would
# take in the design system's DesignKeys.
sensitive_paths:
  # The rule itself, CI, the selector and the build: what decides what "green" means. AGENTS.md
  # holds the merge and receipt rules sessions follow, and docs/status.md who may merge.
  - AGENTS.md
  - docs/status.md
  - .github/**
  - quality/**
  - tools/AgentBridge.Quality/**
  - tests/AgentBridge.Quality.Tests/**
  - build/**
  - infra/**
  - '**/Directory.*.props'
  - '**/Directory.*.targets'
  - '**/Directory.Build.rsp'
  # Every MSBuild input decides what's compiled and which packages come in, not just build/.
  - '**/*.csproj'
  - '**/*.props'
  - '**/*.targets'
  - '*.slnx'
  - nuget.config
  - global.json
  - .config/dotnet-tools.json
  # The wire, the relay and what types into sessions: what lets a remote device act on a machine.
  - docs/protocol/**
  - src/AgentBridge.Protocol/**
  - src/AgentBridge.Transport/**
  - src/AgentBridge.Relay/**
  - src/AgentBridge.Local/**
  - src/AgentBridge.Injector/**
  # Who may call the host, and what it does for a remote device: typing, answering, launching.
  - src/AgentBridge.Host/CallerGuard.cs
  - src/AgentBridge.Host/LocalApi.cs
  - src/AgentBridge.Host/SessionService.cs
  - src/AgentBridge.Host/SessionTransfers.cs
  - src/AgentBridge.Host/Program.cs # builds the remote-authorization policy
  - src/AgentBridge.Host/HostSettings.cs # authorization settings
  - src/AgentBridge.Host/HostControl.cs # applies folder trust, approved devices, remote approval
  - src/AgentBridge.Host/HostConfigFile.cs # persists them
  - src/AgentBridge.App.Core/Transfers.cs # signs commands
  # The Windows app's remote actions: connections, signed transfers and trust, launch
  # permissions, delivery, answers, replies and ending a session.
  - src/AgentBridge.App.Core/Machines.cs
  - src/AgentBridge.App.Core/HostConnection.cs
  - src/AgentBridge.App.Core/HostManager.cs
  - src/AgentBridge.App.Core/LaunchViewModel*.cs
  - src/AgentBridge.App/LaunchView.xaml* # trust-root disclosure and consent
  - src/AgentBridge.App.Core/Deliveries.cs
  - src/AgentBridge.App.Core/QuestionViewModel.cs
  - src/AgentBridge.App.Core/ReplyViewModel.cs
  - src/AgentBridge.App.Core/EndSessionViewModel.cs
  - src/AgentBridge.App.Core/ToastResponder.cs
  - pwa/js/transfer.js # signs commands
  # Trust consent, launch permissions, approval eligibility and delivery to the right session.
  - pwa/js/launch.js
  - pwa/js/ui/launch-view.js
  - pwa/js/answers.js
  - pwa/js/answer-service.js
  # Every other PWA file that builds, routes or admits a remote action: the services that send
  # launch, reply and stop, their views, the sessions page that routes them, and main.js, which
  # wires them together.
  - pwa/js/*-service.js
  - pwa/js/replies.js
  - pwa/js/main.js
  - pwa/js/ui/reply-view.js
  - pwa/js/ui/stop-view.js
  - pwa/js/ui/sessions-page.js
  - pwa/js/host-session.js
  # What an approval or a question shows before someone answers it: a prompt that renders
  # differently from what the agent asked can get a yes it shouldn't (#549).
  - pwa/js/hidden-text.js
  - pwa/js/markdown.js
  - pwa/js/needs-you.js
  - pwa/js/ui/question-view.js
  - pwa/js/ui/needs-you-view.js
  # Which host and session an answer goes to, and the guard against a stray tap approving.
  - pwa/js/ui/session-card.js
  # How an approval's command text lays out: whitespace and text direction.
  - pwa/app.css
  - src/**hiddentext**
  - src/**markdown**
  - src/**needsyou**
  - src/**question**
  - src/**toast**
  # The PWA's build and its packages: what's served to every phone.
  - pwa/tools/build-site.mjs
  - pwa/package.json
  - pwa/package-lock.json
  # The native Apple client (#260, #548): Noise transport, Keychain, signed commands, trust
  # questions and relay sign-in, and what builds it. Its tests change alongside the code they
  # test, which is covered anyway.
  - apple/Sources/**
  - apple/State/**
  - apple/Apps/**
  - apple/project.yml
  - apple/Package.swift
  - apple/scripts/**
  - src/AgentBridge.Host.Delivery/**
  - tools/AgentBridge.RelaySmoke/**
  - pwa/js/host-client.js
  - pwa/js/protocol.js
  - pwa/js/relay.js
  - pwa/js/channels.js
  - pwa/js/connection.js
  - pwa/js/noise-*.js
  - pwa/sw.js
  # Security, approvals, trust, the roster and enrollment, authorization, keys, tokens, signing,
  # and the lifecycle (install, update): by name, wherever they live in the product.
  - src/**secur**
  - src/**approv**
  - src/**trust**
  - src/**roster**
  - src/**enrol**
  - src/**pair**
  - src/**auth**
  - src/**devicekey**
  - src/**privatekey**
  - src/**publickey**
  - src/**keystore**
  - src/**token**
  - src/**signed**
  - src/**signing**
  - src/**signature**
  - src/**secret**
  - src/**crypt**
  - src/**cert**
  - src/**permission**
  - src/**identity**
  - src/**lifecycle**
  - src/**install**
  - src/**update**
  - pwa/js/*identity*
  - pwa/js/*signin*
  - pwa/js/*approv*
  - pwa/js/*trust*
  - pwa/js/*roster*
  - pwa/js/*pair*
  - pwa/js/*update*
  - pwa/js/*push*
  - pwa/js/*forget*
