# Agent Bridge Mono: the monospace for Agent Bridge (docs/design/ui.md section 4.1).
#
# A modified version of Iosevka (SIL OFL 1.1, Copyright (c) 2015-2026 Renzhi Li) built
# from the IoskeleyMono configuration (SIL OFL 1.1, Copyright (c) 2025 Ahmed Hatem),
# with our own changes: a tailed lowercase l (to tell l, 1 and I apart in agent IDs and
# hashes) and a 560 width (between Iosevka's 500 and IoskeleyMono's 600, so tool lists
# and the inspector fit a little more). Build: see README.md beside this file.

[buildPlans.AgentBridgeMono]
family = "Agent Bridge Mono"
spacing = "fixed"
serifs = "sans"
noCvSs = true
noLigation = true
exportGlyphNames = false

[buildPlans.AgentBridgeMono.variants.design]
one = "no-base"
two = "straight-neck-serifless"
three = "flat-top-serifless"
four = "semi-open-serifless"
five = "oblique-flat-serifless"
six = "open-contour"
seven = "straight-serifless"
eight = "two-circles"
nine = "open-contour"
zero = "dotted"
capital-a = "straight-serifless"
capital-b = "standard-serifless"
capital-c = "bilateral-inward-serifed"
capital-d = "standard-serifless"
capital-e = "serifless"
capital-f = "serifless"
capital-g = "toothless-corner-inward-serifed-hooked"
capital-h = "serifless"
capital-i = "serifed"
capital-j = "serifless"
capital-k = "symmetric-touching-serifless"
capital-l = "serifless"
capital-m = "hanging-serifless"
capital-n = "standard-serifless"
capital-p = "closed-serifless"
capital-q = "crossing"
capital-r = "standing-serifless"
capital-s = "serifless"
capital-t = "serifless"
capital-u = "toothless-rounded-serifless"
capital-v = "straight-serifless"
capital-w = "straight-flat-top-serifless"
capital-x = "straight-serifless"
capital-y = "straight-serifless"
capital-z = "straight-serifless"
a = "double-storey-serifless"
b = "toothed-serifless"
c = "bilateral-inward-serifed"
d = "toothed-serifless"
e = "flat-crossbar"
f = "flat-hook-serifless-crossbar-at-x-height"
g = "single-storey-serifless"
h = "straight-serifless"
i = "serifed"
j = "flat-hook-serifed"
k = "symmetric-touching-serifless"
l = "tailed"
m = "serifless"
n = "straight-serifless"
p = "eared-serifless"
q = "straight-serifless"
r = "hookless-serifless"
s = "serifless"
t = "flat-hook-short-neck2"
u = "toothed-serifless"
v = "straight-serifless"
w = "straight-flat-top-serifless"
x = "straight-serifless"
y = "straight-serifless"
z = "straight-serifless"
lower-theta = "oval"
tittle = "square"
diacritic-dot = "square"
punctuation-dot = "square"
braille-dot = "square"
tilde = "low"
asterisk = "penta-mid"
underscore = "high"
caret = "medium"
ascii-grave = "straight"
ascii-single-quote = "straight"
paren = "flat-arc"
brace = "curly-flat-boundary"
guillemet = "straight"
number-sign = "slanted"
ampersand = "closed"
at = "fourfold"
dollar = "through"
cent = "through-cap"
percent = "rings-continuous-slash"
bar = "natural-slope"
question = "corner"
pilcrow = "high"
micro-sign = "toothed-serifless"
decorative-angle-brackets = "middle"
lig-ltgteq = "slanted"
lig-neq = "slightly-slanted"
lig-equal-chain = "without-notch"
lig-hyphen-chain = "without-notch"
lig-plus-chain = "without-notch"
lig-double-arrow-bar = "without-notch"
lig-single-arrow-bar = "without-notch"

[buildPlans.AgentBridgeMono.metricOverride]
xHeight = 520
cap = 690
ascender = 740
sb = 85

accentWidth = 182
accentClearance = 76
accentHeight = 162
accentStackOffset = 208

leading = 1250
parenSize = 860
dotSize = 'blend(weight, [100, 110], [400, 125], [900, 150])'
periodSize = 140

essRatio = 1.03
essRatioUpper = 1.03
essRatioLower = 1.03
essRatioQuestion = 1.03
archDepth = 152
smallArchDepth = 157

[buildPlans.AgentBridgeMono.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.AgentBridgeMono.weights.SemiBold]
shape = 600
menu = 600
css = 600

[buildPlans.AgentBridgeMono.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.AgentBridgeMono.widths.Normal]
shape = 560
menu = 5
css = "normal"

[buildPlans.AgentBridgeMono.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.AgentBridgeMono.slopes.Italic]
angle = 11.8
shape = "italic"
menu = "italic"
css = "italic"

# Characters agent output actually uses. Everything else falls back to the platform font,
# which keeps each file small enough to ship in the apps and the PWA.
[buildPlans.AgentBridgeMono.subset.include]
ranges = [
  [32, 126],      # Basic Latin
  [160, 255],     # Latin-1 Supplement
  [256, 383],     # Latin Extended-A
  [384, 591],     # Latin Extended-B
  [768, 879],     # Combining Diacritical Marks
  [880, 1023],    # Greek
  [1024, 1279],   # Cyrillic
  [8192, 8303],   # General Punctuation
  [8352, 8383],   # Currency Symbols
  [8448, 8527],   # Letterlike Symbols
  [8528, 8591],   # Number Forms
  [8592, 8703],   # Arrows
  [8704, 8959],   # Mathematical Operators
  [8960, 9215],   # Miscellaneous Technical (⌘ ⌥ ⏎ ⏻)
  [9472, 9599],   # Box Drawing
  [9600, 9631],   # Block Elements
  [9632, 9727],   # Geometric Shapes
  [9728, 9983],   # Miscellaneous Symbols
  [9984, 10175],  # Dingbats (✓ ✗)
  [10240, 10495], # Braille (CLI spinners)
]
