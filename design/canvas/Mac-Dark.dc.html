<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Bridge on macOS, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button,textarea,input{font:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px"><dc-import name="Mac" theme="dark" hint-size="1440px,900px"></dc-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
