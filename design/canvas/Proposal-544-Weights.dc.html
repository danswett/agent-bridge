<!-- A proposal, not the spec (docs/design/proposals/544-custom-sans.md). The proposal's faces load from
     docs/design/proposals/544-custom-sans/fonts; Segoe UI Variable is the rendering machine's own. -->
<div style="width: 1440px; height: 600px; box-sizing: border-box; padding: 28px 40px; background: {{t.layer}}; color: {{t.text}}; font-family: 'Proposal Segoe Text', sans-serif">
  <div style="font-size: 13px; line-height: 18px; color: {{t.text2}}">Proposal #544 · not approved · the ramps use 400, 500, 600 and 700, each upright and italic (no light, no heavy). Every cell below is a real face file; none is synthesized.</div>
  <div style="display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 32px; margin-top: 16px">
    <sc-for list="{{fams}}" as="fm">
    <div>
      <div style="font-size: 15px; line-height: 20px; font-weight: 600; color: {{t.accentText}}">{{fm.name}}</div>
      <div style="font-size: 12px; line-height: 16px; color: {{t.text2}}; margin-bottom: 8px">{{fm.files}}</div>
      <sc-for list="{{fm.cells}}" as="c">
      <div style="padding: 6px 0; border-top: 1px solid {{t.stroke}}">
        <div style="font-size: 11px; line-height: 14px; color: {{c.lc}}">{{c.label}}</div>
        <div style="font-family: {{fm.ff}}; font-weight: {{c.w}}; font-style: {{c.s}}; font-size: 22px; line-height: 30px; white-space: nowrap; overflow: hidden">{{fm.sample}}</div>
      </div>
      </sc-for>
    </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const TH = {
      dark: { shell: '#202326', layer: '#272A2E', card: '#2F3338', stroke: 'rgba(255,255,255,0.07)', stroke2: 'rgba(255,255,255,0.12)', sel: 'rgba(255,255,255,0.06)',
        text: '#FFFFFF', text2: 'rgba(255,255,255,0.72)', accent: '#2DD4BF', accentText: '#5EE6D3', onAccent: '#062621', amber: '#FFB224', amberText: '#FFD27A', amberFill: 'rgba(255,178,36,0.1)', violetText: '#C4B5FD', codeBg: 'rgba(255,255,255,0.07)', mark: '#F472B6' },
      light: { shell: '#EEF0F2', layer: '#F9F9F9', card: '#FFFFFF', stroke: 'rgba(0,0,0,0.07)', stroke2: 'rgba(0,0,0,0.12)', sel: 'rgba(0,0,0,0.05)',
        text: '#1A1A1A', text2: 'rgba(0,0,0,0.62)', accent: '#0B7A6E', accentText: '#0B7A6E', onAccent: '#FFFFFF', amber: '#B87700', amberText: '#7A4600', amberFill: '#FFF2D6', violetText: '#5B3CC4', codeBg: 'rgba(0,0,0,0.05)', mark: '#C2185B' }
    };
    const t = TH.light;
    const names = { 400: 'Regular', 500: 'Medium', 600: 'SemiBold', 700: 'Bold' };
    const cells = (gap) => [400, 500, 600, 700].flatMap(w => ['normal', 'italic'].map(s => {
      const missing = gap && w === 500;
      return { w, s, lc: missing ? t.amberText : t.text2, label: missing ? '500 ' + s + ': no face. CSS picks ' + (s === 'italic' ? 'Italic' : 'Regular') + '; DirectWrite picks SemiBold' + (s === 'italic' ? ' Italic' : '') : w + ' ' + s + ' · ' + names[w] + (s === 'italic' ? ' Italic' : '') };
    }));
    return { t, fams: [
      { name: 'A · Slipgates Sans A', files: '8 static TTF/WOFF2 (Iosevka builds no variable font)', ff: "'Slipgates Sans A'", sample: 'Needs you · Il1 0O 3469 · {fix}', cells: cells(false) },
      { name: 'B · Slipgates Sans B', files: 'variable wght 100–900 + opsz, upright and true italic (8 statics also built)', ff: "'Slipgates Sans B'", sample: 'Needs you · Il1 0O 3469 · {fix}', cells: cells(false) },
      { name: 'Slipgates Mono (bundled)', files: '6 statics: 400, 600, 700, upright and italic. Gap: no 500', ff: "'Proposal Mono'", sample: 'Needs you · Il1 0O 3469', cells: cells(true) }
    ] };
  }
}
</script>
