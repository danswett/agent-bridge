<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Proposal #384: PWA phone, a machine's health, read only</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button,textarea,input{font:inherit}
</style>
</helmet>
<!-- Decided by the owner on 2026-11-03 (docs/design/proposals/384-first-run.md); ui.md §6.9 is the spec. A remote client shows a
     machine's Settings and health read only: the same states and words as the Windows app, no
     controls that change the host. Each action names where it is done. -->
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.shell}}; color: {{t.text}}; font-family: system-ui, 'Segoe UI Variable Text', -apple-system, Roboto, sans-serif; font-size: 15px; line-height: 20px; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; overflow: hidden; border-radius: 40px">
  <header style="padding: 52px 8px 8px 4px; display: flex; align-items: center; gap: 4px">
    <button aria-label="Back to Machines" style="width: 44px; height: 44px; border: 0; border-radius: 6px; background: transparent; color: {{t.text}}; display: grid; place-items: center"><dc-import name="Icon" icon="back" size="20" hint-size="20px,20px"></dc-import></button>
    <div style="flex: 1; min-width: 0">
      <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', system-ui, sans-serif; font-size: 24px; line-height: 32px; font-weight: 600">ULTRA</h1>
    </div>
  </header>
  <div style="padding: 0 20px 12px; font-size: 13px; line-height: 18px; color: {{t.text2}}">Online · checked 14:52 · read only</div>
  <div style="flex: 1; overflow: hidden; background: {{t.layer}}; border-top: 1px solid {{t.stroke}}; padding: 8px 12px 0">
    <div role="note" style="margin: 8px 0 4px; padding: 12px 14px; border-radius: 8px; border: 1px solid {{t.stroke2}}; background: {{t.card}}; font-size: 14px; line-height: 20px">
      <span style="font-weight: 600">Change these on ULTRA</span>
      <span style="color: {{t.text2}}"> · Settings in the Windows app</span>
    </div>
    <sc-for list="{{groups}}" as="gp">
      <div style="padding: 16px 8px 6px; font-size: 13px; line-height: 18px; font-weight: 600; color: {{t.text2}}">{{gp.label}}</div>
      <div style="border-radius: 8px; background: {{t.card}}; border: 1px solid {{t.stroke}}">
        <sc-for list="{{gp.rows}}" as="r">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 14px; border-top: {{r.bt}}; box-sizing: border-box">
          <sc-if value="{{r.g}}"><span style="width: 18px; height: 18px; flex: none; display: inline-grid; place-items: center"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true">
            <sc-if value="{{r.g.isIdle}}"><circle cx="8" cy="8" r="5.6" fill="none" stroke="{{r.g.c}}" stroke-width="1.6"></circle></sc-if>
            <sc-if value="{{r.g.isNeeds}}"><circle cx="8" cy="8" r="6.6" fill="{{r.g.c}}"></circle><path d="M8 4.6v4.2" stroke="{{r.g.ink}}" stroke-width="1.9" stroke-linecap="round"></path><circle cx="8" cy="11.3" r="1.1" fill="{{r.g.ink}}"></circle></sc-if>
            <sc-if value="{{r.g.isDone}}"><circle cx="8" cy="8" r="5.8" fill="none" stroke="{{r.g.c}}" stroke-width="1.5"></circle><path d="M5.3 8.2l1.9 1.9 3.6-3.8" fill="none" stroke="{{r.g.c}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></sc-if>
            <sc-if value="{{r.g.isEnded}}"><circle cx="8" cy="8" r="5.6" fill="none" stroke="{{r.g.c}}" stroke-width="1.4" stroke-dasharray="0.1 2.6" stroke-linecap="round"></circle></sc-if>
          </svg></span></sc-if>
          <div style="flex: 1; min-width: 0">
            <div>{{r.title}}</div>
            <div style="font-size: 13px; line-height: 18px; color: {{t.text2}}">{{r.meta}}</div>
          </div>
          <span style="font-size: 14px; color: {{r.wc}}; text-align: right">{{r.words}}</span>
        </div>
        </sc-for>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    // Copies of design/tokens.json (color.role and the PWA surfaces), as in PWA-Phone.dc.html.
    const dark = {
      shell: '#202326', layer: '#272A2E', card: '#2F3338', stroke: 'rgba(255,255,255,0.07)', stroke2: 'rgba(255,255,255,0.12)',
      text: '#FFFFFF', text2: 'rgba(255,255,255,0.72)', text3: 'rgba(255,255,255,0.54)',
      amber: '#FFB224', amberInk: '#14100A', amberText: '#FFD27A', neutral: '#8B949E', dangerText: '#FF9494'
    };
    const light = {
      shell: '#EEF0F2', layer: '#F9F9F9', card: '#FFFFFF', stroke: 'rgba(0,0,0,0.07)', stroke2: 'rgba(0,0,0,0.12)',
      text: '#1A1A1A', text2: 'rgba(0,0,0,0.62)', text3: 'rgba(0,0,0,0.58)',
      amber: '#B87700', amberInk: '#FFFFFF', amberText: '#7A4600', neutral: '#6E7781', dangerText: '#C9302C'
    };
    const t = theme === 'light' ? light : dark;
    const glyph = (st) => {
      const k = { ok: 'done', needs: 'needs', missing: 'idle', off: 'ended' }[st];
      return k ? { isIdle: k === 'idle', isNeeds: k === 'needs', isDone: k === 'done', isEnded: k === 'ended', c: st === 'needs' ? t.amber : t.neutral, ink: t.amberInk } : null;
    };
    const group = (label, rows) => ({ label, rows: rows.map(([title, meta, st, words], i) => ({
      title, meta, words, g: glyph(st), bt: i ? `1px solid ${t.stroke}` : '0',
      wc: st === 'needs' ? t.amberText : st === 'off' ? t.text3 : t.text2
    })) });
    return {
      t,
      groups: [
        group('Agents', [
          ['Copilot CLI', 'Last hook 14:49', 'ok', 'Working'],
          ['Agency', 'Last hook 13:02', 'ok', 'Working'],
          ['Codex CLI', 'Hook not trusted in Codex', 'needs', 'Needs you on ULTRA'],
          ['Claude Code', 'Installed, not set up', 'off', 'Not selected']
        ]),
        group('This machine', [
          ['Bridge Host', 'Heartbeat 14:52', 'ok', 'Working'],
          ['Launch folders', '2 approved', 'ok', 'Working']
        ]),
        group('Trust', [
          ['Permission prompts', 'New sessions', null, 'Standard prompts'],
          ['Folder-trust answers', 'From my devices', null, 'Off']
        ])
      ]
    };
  }
}
</script>
</body>
</html>
