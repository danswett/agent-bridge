.p592f-dev { position: relative; overflow: hidden; flex: none; }
.p592f-abs { position: absolute; }
.p592f-row { display: grid; grid-template-columns: 16px 20px minmax(0, 1fr) auto; grid-template-rows: auto auto; column-gap: 8px; align-items: center; height: 100%; padding: 8px 12px 8px 4px; }
.p592f-title { grid-column: 3; grid-row: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p592f-sub { grid-column: 3 / span 2; grid-row: 2; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; line-height: 16px; }
.p592f-age { grid-column: 4; grid-row: 1; font-size: 12px; white-space: nowrap; }
.p592f-chip { grid-column: 4; grid-row: 1; display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; height: 20px; border-radius: 10px; font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; }
.p592f-grip { grid-column: 1; grid-row: 1 / span 2; display: flex; align-items: center; justify-content: center; }
.p592f-glyph { grid-column: 2; grid-row: 1 / span 2; width: 20px; height: 20px; display: block; }
.p592f-cap b { display: block; font-size: 14px; line-height: 20px; font-weight: 600; }
.p592f-cap p { margin: 4px 0 0; font-size: 12px; line-height: 16px; }
.p592f-key { display: inline-block; min-width: 28px; padding: 3px 8px; border-radius: 4px; font-size: 12px; line-height: 16px; font-weight: 600; text-align: center; }

    const box = (x, yy, ww, hh) => `left: ${x}px; top: ${yy - scroll}px; width: ${ww}px; height: ${hh}px`;

    const row = (id, extra) => {
      const [title, sub, age, kind, unread] = SESSIONS[id];
      const [role, g] = GLYPHS[kind];
      return Object.assign({ isRow: true, title, sub, age, weight: unread ? 600 : 400, g, gc: t[role], knock: t.layer }, extra);
    };
    const gripOp = (s) => (f.grip === 'hover' ? (s.hover || s.focus ? 1 : 0) : 1);
    const selBar = (on) => on ? `left: 0; top: 50%; width: 3px; height: 16px; margin-top: -8px; border-radius: 2px; background: ${f.hc ? t.bridge : t.bridge}` : 'display: none';

    const items = [];
    // Traces first, so rows paint over them: a dashed outline where a neighbour was before it eased.
    (f.slots || []).forEach((s, i) => {
      if (s.trace == null) return;
      const p = slotPos(i), o = oldPos(i, s.trace);
      items.push({ isBox: true, text: '', style: `${box(o.x, o.y, p.w, p.hgt)}; border-radius: 8px; outline: 1px dashed ${t.stroke2}; outline-offset: -1px; opacity: .9` });
    });
    if (f.zone) {
      const zh = f.zone, lh = h - top;
      items.push({ isZone: true, text: f.zoneText || '', style: `left: 0; width: ${listW}px; top: ${lh - zh}px; height: ${zh}px; background: linear-gradient(to bottom, transparent, color-mix(in srgb, ${t.bridge} 22%, transparent)); border-top: 1px dashed ${t.bridge}; z-index: 4` });
    }
    (f.slots || []).forEach((s, i) => {
      const p = slotPos(i);
      if (s.h) {
        items.push({ isHead: true, text: s.h, cue: s.cue || '', color: s.target ? t.bridge : t.text2, style: box(0, p.y, listW, HEAD) });
      } else if (s.gap) {
        const hc = f.hc;
        items.push({ isBox: true, text: '', style: `${box(p.x, p.y, p.w, p.hgt)}; border-radius: 8px; background: ${hc ? 'transparent' : t.subtle}; ${hc ? `outline: 1px dashed ${t.text3}; outline-offset: -1px` : `box-shadow: inset 0 0 0 1px ${t.stroke}`}` });
      } else if (s.ph) {
        items.push({ isBox: true, text: s.ph, style: `${box(p.x, p.y, p.w, p.hgt)}; border-radius: 8px; outline: 1px dashed ${t.stroke2}; outline-offset: -1px` });
      } else if (s.r) {
        const sel = s.st === 'sel' || s.sel, sink = s.st === 'sink', press = sink || s.st === 'pressed';
        let face = `position: relative; height: 100%; border-radius: ${f.cols === 2 ? 8 : 4}px; background: ${press || sel ? t.selected : (f.cols === 2 ? t.subtle : 'transparent')}`;
        if (sink) face += '; transform: scale(.985)';
        if (s.focus) face += `; outline: 2px solid ${t.bridge}; outline-offset: -2px`;
        if (s.vo) face += '; outline: 3px solid #000; outline-offset: -3px; box-shadow: inset 0 0 0 5px #fff';
        if (f.hc && sel) face += `; outline: 2px solid ${t.bridge}; outline-offset: -2px`;
        items.push(row(s.r, { style: box(p.x, p.y, p.w, p.hgt), face, bar: selBar(sel), gripColor: s.hover ? t.text2 : t.text3, gripOp: gripOp(s) }));
      }
    });

    let ptr = {};
    if (f.lift) {
      const L = f.lift, p = slotPos(L.at);
      const sc = f.rm ? 1 : (L.scale == null ? 1.02 : L.scale), sh = L.shadow == null ? 1 : L.shadow;
      let face = `position: relative; height: 100%; transform: scale(${sc}); border-radius: 8px`;
      if (f.rm) face += `; background: ${t.card}; outline: 2px solid ${t.bridge}; outline-offset: -2px`;
      else if (f.hc) face += `; background: ${t.card}; outline: 2px solid ${t.bridge}; outline-offset: -2px`;
      else face += `; background: ${t.tint}; box-shadow: ${t.shadow(sh)}; outline: 1px solid ${t.stroke2}; outline-offset: -1px`;
      if (L.sel && !f.rm && !f.hc) face += `; background-image: linear-gradient(${t.selected}, ${t.selected})`;
      const chip = L.chip || '';
      const cancel = chip === 'Cancel';
      items.push(row(L.r, {
        style: `${box(p.x + (L.dx || 0), p.y + (L.dy || 0), p.w, p.hgt)}; z-index: 5`, face, bar: selBar(L.sel), gripColor: t.text, gripOp: 1,
        chip, age: chip ? '' : SESSIONS[L.r][2], chipIcon: cancel ? ICON_X : ICON_PIN, chipFill: cancel ? 'none' : 'currentColor', chipStroke: cancel ? 'currentColor' : 'none',
        chipStyle: f.hc ? `color: ${t.text}; outline: 1px solid ${t.bridge}` : (cancel ? `color: ${t.text2}; background: ${t.subtle2}` : `color: ${t.bridge}; background: color-mix(in srgb, ${t.bridge} 14%, transparent)`),
      }));
    }
    if (f.ptr) {
      const P = f.ptr, p = slotPos(P.at == null ? 0 : P.at);
      const x = p.x + (P.dx == null ? 180 : P.dx), yy = p.y + (P.dy == null ? 28 : P.dy) - scroll;
      if (P.kind === 'mouse') ptr = { mouse: true, x, y: yy };
      else {
        const c = 2 * Math.PI * 25, r = P.ring || 0;
        ptr = { touch: true, x0: x - 28, y0: yy - 28, dash: `${(c * r).toFixed(1)} ${c.toFixed(1)}`, ringOp: r > 0 ? 1 : 0, up: !!P.up };
      }
    }
    let menu = null;
    if (f.menu) {
      const p = slotPos(f.menu.at);
      menu = { title: f.menu.title || '', items: f.menu.items, style: `right: 16px; top: ${p.y + (f.menu.dy == null ? 44 : f.menu.dy) - scroll}px; min-width: 180px; z-index: 6` };
    }

    const radius = phone ? 32 : 8;
    const devStyle = `width: ${w}px; height: ${h}px; border-radius: ${radius}px; background: ${t.layer}; box-shadow: 0 0 0 ${phone ? 6 : 1}px ${t.bezel}${phone ? '' : ''}`;
    const barStyle = phone
      ? `left: 0; right: 0; top: 28px; height: 56px; display: flex; align-items: center; padding: 0 16px 0 16px; border-bottom: 1px solid ${t.stroke}; background: ${t.layer}`
      : `left: 0; width: ${listW}px; top: 32px; height: 48px; display: flex; align-items: center; padding: 0 12px 0 16px; border-bottom: 1px solid ${t.stroke}; background: ${t.layer}`;
    const listStyle = `left: 0; top: ${top}px; width: ${listW}px; bottom: 0; overflow: ${f.overflow ? 'visible' : 'hidden'}; z-index: 1`;
    return {
      t, capT: this.props.theme === 'light' ? LIGHT : DARK, w, isPhone: phone, isDesk: !phone, listW, devStyle, barStyle, barFont: phone ? 20 : 18, listStyle, items, ptr, menu,
      toast: f.toast || '', keys: f.keys || null, say: f.say || '', label: f.label || '', notes: f.notes || [],
    };
  }
}
</script>
</body>
</html>
