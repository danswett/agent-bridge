<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Proposal #592: High contrast, reduced motion, keyboard and screen readers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<!-- A proposal, not the spec (docs/design/proposals/592-reorder.md). Each frame is a Proposal-592-Frame. -->
<div style="width: 1660px; height: 880px; box-sizing: border-box; padding: 32px; background: {{t.bg}}; color: {{t.text}}; font-family: 'Segoe UI Variable Text', system-ui, -apple-system, Roboto, sans-serif; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px">
    <span style="display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; line-height: 16px; font-weight: 600; color: {{t.bridge}}; background: {{t.tag}}">#592 · Decided (owner, 2026-11-04)</span>
    <span style="font-size: 12px; color: {{t.text2}}">{{t.name}}</span>
  </div>
  <h1 style="margin: 10px 0 2px; font-family: 'Segoe UI Variable Display', system-ui, sans-serif; font-size: 22px; line-height: 28px; font-weight: 600">High contrast, reduced motion, keyboard and screen readers</h1>
  <p style="margin: 0 0 28px; font-size: 13px; line-height: 18px; color: {{t.text2}}">The lift never depends on a shadow or on motion alone, and every move by drag has a move by key, by menu and by screen-reader action.</p>
  <div style="display: flex; gap: 28px; align-items: flex-start">
    <sc-for list="{{frames}}" as="fr">
      <dc-import name="Proposal-592-Frame" theme="{{theme}}" f="{{fr}}" hint-size="300px,760px"></dc-import>
    </sc-for>


  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1660,"height":880}}'>
const THEMES = {
  dark: { bg: '#1B1E21', text: '#FFFFFF', text2: 'rgba(255,255,255,.72)', text3: 'rgba(255,255,255,.54)', bridge: '#2DD4BF', tag: 'rgba(45,212,191,.14)', stroke: 'rgba(255,255,255,.12)', name: 'Dark' },
  light: { bg: '#E6E9EC', text: '#1A1A1A', text2: 'rgba(0,0,0,.62)', text3: 'rgba(0,0,0,.58)', bridge: '#0B7A6E', tag: 'rgba(11,122,110,.12)', stroke: 'rgba(0,0,0,.12)', name: 'Light' },
};
// Slots: { h } a group header, { r } a session row, { gap } the landing gap, { ph } an empty-group placeholder.
// trace: n draws a dashed outline where a neighbour was n slots further on, before it eased.
const P = { h: 'Pinned' }, S = { h: 'Sessions' };
const rows = (ids, extra) => ids.split('').map(r => Object.assign({ r }, (extra || {})[r] || {}));
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme === 'light' ? 'light' : 'dark';
    const desk = { kind: 'desktop', grip: 'hover', w: 440, h: 560 };
    const frames = [
      Object.assign({}, desk, { hc: true, label: '1 · High contrast (forced colours)', slots: [P, ...rows('ab'), S, ...rows('def', { d: { trace: 1 }, e: { trace: 1 }, f: { trace: 1 } }), { gap: true }, ...rows('gh')], lift: { r: 'c', at: 7, dy: -20, sel: true }, ptr: { kind: 'mouse', at: 7, dx: 10, dy: 4 },
        notes: ['A 2 px Highlight outline replaces the shadow and the tint, which forced colours would drop. The gap is a dashed GrayText outline; the header cue uses Highlight. Shown in Night sky.'] }),
      { grip: 'all', rm: true, label: '2 · Reduced motion', slots: [P, ...rows('ab'), S, ...rows('def'), { gap: true }, ...rows('ghij')], lift: { r: 'c', at: 7, dy: -22, sel: true }, ptr: { at: 7, dx: 232, dy: 6, ring: 1 },
        notes: ['No sink, no scale and no shadow: a 2 px Bridge outline on the card surface marks the lift. Neighbours jump to their places and the drop is instant (0 ms); the card still follows the finger.'] },
      Object.assign({}, desk, { label: '3 · Keyboard: Alt+↓', slots: [P, ...rows('ab'), S, ...rows('dcefgh', { d: { trace: 1 }, c: { st: 'sel', focus: true, trace: -1 } })], keys: ['Alt', '↓'], say: 'Moved to position 2 of 10 in Sessions.',
        notes: ['Alt+↑/↓, and Move up or Move down in the menu, use the same make-room motion: the card and the neighbour it passes both ease to their places with reorder. Focus stays on the card.'] }),
      { grip: 'all', label: '4 · Screen-reader actions', slots: [P, ...rows('ab'), S, ...rows('cdefghij', { c: { st: 'sel', vo: true } })], menu: { at: 4, dy: 60, title: 'Actions', items: ['Move up', 'Move down', 'Pin'] }, say: 'Dashboard card polish, Idle, 12 minutes ago. Actions available.',
        notes: ['VoiceOver (swipe up or down) and TalkBack (Actions) offer the menu’s moves as custom actions. Each move is announced as it is on desktop.'] },
    ];
    return { t: THEMES[theme], theme, frames };
  }
}
</script>
</body>
</html>
